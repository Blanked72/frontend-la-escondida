<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Cocina</title>
    <style>
        :root { --primary: #2c3e50; --accent: #27ae60; --bg: #1a252f; }
        body { font-family: sans-serif; background-color: var(--bg); color: #ecf0f1; margin: 0; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        nav a { padding: 8px 12px; background: #34495e; color: white; text-decoration: none; border-radius: 4px; }
        .grid-ordenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card-cocina { background: #2c3e50; border-radius: 8px; padding: 15px; border-left: 5px solid #f39c12; }
        .card-cocina h3 { margin-top: 0; border-bottom: 1px solid #34495e; padding-bottom: 5px; }
        .item-linea { display: flex; justify-content: space-between; padding: 5px 0; font-size: 1.1em; }
        button { width: 100%; margin-top: 15px; padding: 10px; background: var(--accent); border: none; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        button:hover { background: #219150; }
    </style>
</head>
<body>
    <header>
        <h1>Pantalla de Cocina</h1>
        <nav>
            <a href="index.html">Tomar Orden</a>
            <a href="cocina.html">Cocina</a>
            <a href="caja.html">Caja</a>
            <a href="inventario.html">Inventario</a>
            <a href="reportes.html">Reportes</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <div id="grid-cocina" class="grid-ordenes">Cargando órdenes de cocina...</div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function cargarCocina() {
            try {
                const res = await fetch(`${API_URL}/cocina`);
                const items = await res.json();
                
                const ordenesMap = {};
                items.forEach(item => {
                    if (!ordenesMap[item.id_orden]) {
                        ordenesMap[item.id_orden] = {
                            numero_mesa: item.numero_mesa,
                            productos: []
                        };
                    }
                    ordenesMap[item.id_orden].productos.push(item);
                });

                const container = document.getElementById('grid-cocina');
                container.innerHTML = '';

                const ordenesIds = Object.keys(ordenesMap);
                if (ordenesIds.length === 0) {
                    container.innerHTML = '<h2>No hay órdenes pendientes en cocina 🎉</h2>';
                    return;
                }

                ordenesIds.forEach(id_orden => {
                    const orden = ordenesMap[id_orden];
                    const div = document.createElement('div');
                    div.className = 'card-cocina';
                    
                    let htmlProductos = '';
                    orden.productos.forEach(prod => {
                        htmlProductos += `
                            <div class="item-linea">
                                <span>${prod.nombre}</span>
                                <strong>x${prod.cantidad}</strong>
                            </div>
                        `;
                    });

                    div.innerHTML = `
                        <h3>Orden #${id_orden} - ${orden.numero_mesa}</h3>
                        ${htmlProductos}
                        <button onclick="marcarLista(${id_orden})">Marcar como Lista</button>
                    `;
                    container.appendChild(div);
                });

            } catch (err) {
                console.error('Error cargando cocina:', err);
            }
        }

        async function marcarLista(id_orden) {
            try {
                const res = await fetch(`${API_URL}/ordenes/${id_orden}/lista`, { method: 'PUT' });
                if (res.ok) {
                    cargarCocina();
                } else {
                    alert('Error al actualizar el estado');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        window.onload = () => {
            cargarCocina();
            setInterval(cargarCocina, 10000);
        };
    </script>
</body>
</html>
