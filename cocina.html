<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cocina - Pendientes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .orden-card { border: 2px solid #ff9800; padding: 15px; border-radius: 8px; width: 250px; background: #fff3e0; }
        button { background: #2196F3; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>👨‍🍳 Vista de Cocina</h2>
    <div id="contenedor-cocina" class="grid"></div>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function cargarCocina() {
            const res = await fetch(`${API_URL}/ordenes`);
            const ordenes = await res.json();
            
            const pendientes = ordenes.filter(o => o.estado === 'Pendiente');
            const contenedor = document.getElementById('contenedor-cocina');
            contenedor.innerHTML = '';

            pendientes.forEach(o => {
                let itemsHTML = '';
                o.detalles.forEach(d => {
                    itemsHTML += `<li>${d.cantidad}x ${d.producto} ${d.notas ? `<b>(${d.notas})</b>` : ''}</li>`;
                });

                contenedor.innerHTML += `
                    <div class="orden-card">
                        <h3>Mesa #${o.numero_mesa}</h3>
                        <ul>${itemsHTML}</ul>
                        <button onclick="marcarListo(${o.id_orden})">✅ Marcar como Listo</button>
                    </div>
                `;
            });
        }

        async function marcarListo(id) {
            await fetch(`${API_URL}/ordenes/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'Listo' })
            });
            cargarCocina();
        }

        setInterval(cargarCocina, 4000);
        cargarCocina();
    </script>
</body>
</html>
