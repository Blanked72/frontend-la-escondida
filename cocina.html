<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Cocina</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-orden { border-left: 5px solid #ffc107; }
        .card-domicilio { border-left: 5px solid #0d6efd; }
    </style>
</head>
<body class="p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Comandos de Cocina</h2>
            <button class="btn btn-outline-secondary" onclick="cargarCocina()">Actualizar Manualmente</button>
        </div>

        <div id="contenedor-ordenes" class="row g-3">
            <!-- Las órdenes se cargarán dinámicamente aquí -->
        </div>
    </div>

    <script>
        const API_URL = 'https://backend-la-escondida.onrender.com/api';

        async function cargarCocina() {
            try {
                const response = await fetch(`${API_URL}/ordenes`);
                const ordenes = await response.json();
                
                const contenedor = document.getElementById('contenedor-ordenes');
                contenedor.innerHTML = '';

                // Filtrar solo las órdenes pendientes o a domicilio
                const pendientes = ordenes.filter(o => o.estado === 'Pendiente' || o.estado === 'A Domicilio');

                if (pendientes.length === 0) {
                    contenedor.innerHTML = '<div class="col-12"><div class="alert alert-info text-center">No hay órdenes pendientes en cocina.</div></div>';
                    return;
                }

                pendientes.forEach(orden => {
                    const esDomicilio = orden.estado === 'A Domicilio';
                    const tarjetaClass = esDomicilio ? 'card-domicilio' : 'card-orden';
                    
                    let detallesHtml = '';
                    if (orden.detalles && orden.detalles.length > 0) {
                        detallesHtml = orden.detalles.map(d => `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <span><strong>${d.cantidad}x</strong> ${d.producto || d.notas || 'Producto'}</span>
                            </li>
                        `).join('');
                    } else {
                        detallesHtml = '<li class="list-group-item text-muted">Sin detalles especificados</li>';
                    }

                    contenedor.innerHTML += `
                        <div class="col-md-4">
                            <div class="card shadow-sm ${tarjetaClass}">
                                <div class="card-header d-flex justify-content-between align-items-center">
                                    <h5 class="mb-0">${orden.numero_mesa}</h5>
                                    <span class="badge ${esDomicilio ? 'bg-primary' : 'bg-warning text-dark'}">${orden.estado}</span>
                                </div>
                                <div class="card-body">
                                    <ul class="list-group list-group-flush mb-3">
                                        ${detallesHtml}
                                    </ul>
                                    <button class="btn btn-success w-100" onclick="marcarEntregado(${orden.id_orden})">
                                        Marcar como Listo / Entregado
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error('Error al cargar órdenes de cocina:', error);
            }
        }

        async function marcarEntregado(id) {
            try {
                const response = await fetch(`${API_URL}/ordenes/${id}/entregar`, {
                    method: 'PUT'
                });
                if (response.ok) {
                    cargarCocina();
                } else {
                    alert('Error al actualizar la orden');
                }
            } catch (error) {
                console.error('Error al entregar orden:', error);
            }
        }

        // Auto-refresco cada 10 segundos
        setInterval(cargarCocina, 10000);
        
        // Carga inicial
        cargarCocina();
    </script>
</body>
</html>
