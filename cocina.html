<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Cocina - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #333; color: white; margin: 0; padding: 1rem; }
        h1 { text-align: center; color: #f39c12; }
        .logo-icon { height: 80px; vertical-align: middle; margin-right: 8px; }
        .grid-cocina { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .ticket { background-color: #fff; color: #000; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); border-top: 5px solid #e74c3c; }
        .ticket h2 { margin: 0 0 10px 0; font-size: 1.2rem; border-bottom: 2px dashed #ccc; padding-bottom: 5px; }
        .item { font-size: 1.1rem; margin: 5px 0; font-weight: bold; }
        .nota-producto { color: #c0392b; font-weight: normal; font-style: italic; font-size: 0.95rem; }
        .alerta-insumo { background-color: #fdecea; color: #c0392b; font-weight: bold; padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 0.95rem; }
        .info-cliente { background-color: #eaf2f8; color: #2c3e50; padding: 8px; border-radius: 4px; margin: 5px 0 10px; font-size: 0.95rem; }
        .btn-listo { background-color: #27ae60; color: white; border: none; padding: 10px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 15px; }
        .btn-rechazar { background-color: #e74c3c; color: white; border: none; padding: 10px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 8px; }
    </style>
</head>
<body>

    <h1><img src="logo.png" alt="La Escondida" class="logo-icon">👨‍🍳 Comandas Pendientes</h1>
    <div id="monitor" class="grid-cocina">
        <p>Buscando nuevas órdenes...</p>
    </div>

    <script>
        async function cargarOrdenesCocina() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/cocina');
                
                // Si el servidor está apagado o falla, esto lo atrapa
                if (!respuesta.ok) {
                    throw new Error('Error en el servidor');
                }

                const datos = await respuesta.json();
                const monitor = document.getElementById('monitor');
                monitor.innerHTML = ''; 

                if (datos.length === 0) {
                    monitor.innerHTML = '<p>No hay órdenes pendientes. ¡Todo limpio! ✨</p>';
                    return;
                }

                const ordenesAgrupadas = datos.reduce((acc, fila) => {
                    if (!acc[fila.id_orden]) {
                        acc[fila.id_orden] = {
                            numeroDia: fila.numero_dia,
                            mesa: fila.numero_mesa,
                            tipoPedido: fila.tipo_pedido,
                            nombreCliente: fila.nombre_cliente,
                            telefono: fila.telefono,
                            direccion: fila.direccion,
                            productos: [],
                            alerta: fila.alerta_insumo
                        };
                    }
                    acc[fila.id_orden].productos.push({ nombre: fila.nombre, cantidad: fila.cantidad, nota: fila.nota });
                    return acc;
                }, {});

                for (let id_orden in ordenesAgrupadas) {
                    const orden = ordenesAgrupadas[id_orden];
                    let htmlProductos = '';
                    orden.productos.forEach(prod => {
                        htmlProductos += `<div class="item">👉 ${prod.cantidad}x ${prod.nombre}${prod.nota ? ` <span class="nota-producto">(${prod.nota})</span>` : ''}</div>`;
                    });

                    const origen = orden.tipoPedido === 'domicilio' ? '🚚 A domicilio'
                        : orden.tipoPedido === 'recoger' ? '🛍️ Para recoger'
                        : `Mesa ${orden.mesa}`;

                    const htmlInfoCliente = orden.tipoPedido !== 'mesa'
                        ? `<div class="info-cliente">👤 ${orden.nombreCliente} | 📞 ${orden.telefono}${orden.tipoPedido === 'domicilio' ? ' | 📍 ' + orden.direccion : ''}</div>`
                        : '';

                    const htmlAlerta = orden.alerta
                        ? `<div class="alerta-insumo">⚠️ Falta insumo: ${orden.alerta}</div>`
                        : '';

                    const motivoSeguro = orden.alerta ? orden.alerta.replace(/'/g, "\\'") : '';
                    const htmlBotonRechazar = orden.alerta
                        ? `<button class="btn-rechazar" onclick="rechazarOrden(${id_orden}, '${motivoSeguro}')">❌ Rechazar (sin insumo)</button>`
                        : '';

                    const ticket = document.createElement('div');
                    ticket.className = 'ticket';
                    ticket.innerHTML = `
                        <h2>Orden #${orden.numeroDia} - ${origen}</h2>
                        ${htmlInfoCliente}
                        ${htmlProductos}
                        ${htmlAlerta}
                        <button class="btn-listo" onclick="marcarLista(${id_orden})">✅ Marcar como Lista</button>
                        ${htmlBotonRechazar}
                    `;
                    monitor.appendChild(ticket);
                }
            } catch (error) {
                console.error("Error completo:", error);
                document.getElementById('monitor').innerHTML = '<p style="color:#e74c3c;">❌ Error: No se pudo conectar con el servidor. Verifica que la terminal negra de Node esté corriendo.</p>';
            }
        }

        async function marcarLista(id_orden) {
            const confirmar = confirm(`¿Estás seguro de que la Orden #${id_orden} ya está terminada?`);
            if (!confirmar) return;

            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/lista`, {
                    method: 'PUT'
                });
                
                if (respuesta.ok) {
                    cargarOrdenesCocina();
                } else {
                    alert("Error al intentar marcar la orden.");
                }
            } catch (error) {
                alert("Hubo un error al conectar con el servidor.");
            }
        }

        async function rechazarOrden(id_orden, motivo) {
            const confirmar = confirm(`¿Rechazar la Orden #${id_orden} por falta de insumo?\n${motivo}`);
            if (!confirmar) return;

            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/rechazar`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ motivo })
                });

                if (respuesta.ok) {
                    cargarOrdenesCocina();
                } else {
                    const err = await respuesta.json();
                    alert(err.error || "No se pudo rechazar la orden.");
                }
            } catch (error) {
                alert("Hubo un error al conectar con el servidor.");
            }
        }

        cargarOrdenesCocina();
        setInterval(cargarOrdenesCocina, 5000);
    </script>
</body>
</html>
