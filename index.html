<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Menú Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h1 class="text-center mb-4">La Escondida - Menú Digital</h1>

        <div class="row">
            <!-- Menú de Productos -->
            <div class="col-md-8">
                <h3>Nuestros Productos</h3>
                <div class="row g-3" id="lista-productos">
                    <div class="col-12 text-center text-muted">Cargando menú...</div>
                </div>
            </div>

            <!-- Carrito del Cliente -->
            <div class="col-md-4">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">Tu Pedido</h4>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="mesa-cliente" class="form-label">Número de Mesa / Nombre</label>
                            <input type="text" id="mesa-cliente" class="form-control" placeholder="Ej: Mesa 3 o Para Llevar" required>
                        </div>
                        <ul class="list-group mb-3" id="carrito-lista">
                            <li class="list-group-item text-center text-muted">El carrito está vacío</li>
                        </ul>
                        <div class="d-flex justify-content-between fs-4 fw-bold mb-3">
                            <span>Total:</span>
                            <span>$<span id="carrito-total">0.00</span></span>
                        </div>
                        <button class="btn btn-success w-100 btn-lg" onclick="enviarPedido()">Realizar Pedido</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend-la-escondida.onrender.com/api';
        let carrito = [];

        async function cargarMenu() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                const contenedor = document.getElementById('lista-productos');
                contenedor.innerHTML = '';

                productos.forEach(prod => {
                    contenedor.innerHTML += `
                        <div class="col-md-6">
                            <div class="card h-100 shadow-sm">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title">${prod.nombre}</h5>
                                        <p class="card-text text-muted">$${parseFloat(prod.precio).toFixed(2)}</p>
                                    </div>
                                    <button class="btn btn-outline-primary mt-2" onclick="agregarProducto(${prod.id_producto}, '${prod.nombre}', ${prod.precio})">
                                        Agregar al Pedido
                                    </button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                console.error('Error al cargar productos:', err);
                document.getElementById('lista-productos').innerHTML = '<div class="alert alert-danger">Error al conectar con el servidor.</div>';
            }
        }

        function agregarProducto(id, nombre, precio) {
            const existe = carrito.find(p => p.id_producto === id);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({ id_producto: id, nombre, precio, cantidad: 1 });
            }
            renderizarCarrito();
        }

        function renderizarCarrito() {
            const lista = document.getElementById('carrito-lista');
            const totalElemento = document.getElementById('carrito-total');
            
            if (carrito.length === 0) {
                lista.innerHTML = '<li class="list-group-item text-center text-muted">El carrito está vacío</li>';
                totalElemento.innerText = '0.00';
                return;
            }

            lista.innerHTML = '';
            let total = 0;

            carrito.forEach((item, index) => {
                const subtotal = item.precio * item.cantidad;
                total += subtotal;
                lista.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong>${item.nombre}</strong><br>
                            <small class="text-muted">$${item.precio} x ${item.cantidad}</small>
                        </div>
                        <div>
                            <span class="me-2 fw-bold">$${subtotal.toFixed(2)}</span>
                            <button class="btn btn-sm btn-outline-danger" onclick="eliminarDelCarrito(${index})">&times;</button>
                        </div>
                    </li>
                `;
            });

            totalElemento.innerText = total.toFixed(2);
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            renderizarCarrito();
        }

        async function enviarPedido() {
            const mesaInput = document.getElementById('mesa-cliente').value.trim();
            if (!mesaInput) return alert('Ingresa un número de mesa o nombre');
            if (carrito.length === 0) return alert('El carrito está vacío');

            const total = parseFloat(document.getElementById('carrito-total').innerText);

            try {
                const res = await fetch(`${API_URL}/ordenes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ numero_mesa: mesaInput, detalles: carrito, total })
                });

                if (res.ok) {
                    alert('¡Pedido enviado con éxito a la cocina!');
                    carrito = [];
                    document.getElementById('mesa-cliente').value = '';
                    renderizarCarrito();
                } else {
                    alert('Hubo un problema al procesar tu pedido');
                }
            } catch (err) {
                console.error('Error enviando orden:', err);
            }
        }

        cargarMenu();
    </script>
</body>
</html>
