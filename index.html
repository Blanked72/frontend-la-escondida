<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Toma de Órdenes</title>
    <style>
        :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f8f9fa; --card-bg: #ffffff; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); margin: 0; padding: 20px; color: #333; }
        header { text-align: center; margin-bottom: 20px; }
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        nav a { padding: 10px 15px; background: var(--primary); color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        nav a:hover { background: var(--accent); }
        .container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; max-width: 1200px; margin: 0 auto; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
        .panel { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .grid-productos { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .card-producto { border: 1px solid #ddd; padding: 15px; border-radius: 8px; text-align: center; background: #fff; cursor: pointer; transition: transform 0.2s; }
        .card-producto:hover { transform: translateY(-3px); border-color: var(--accent); }
        .card-producto h3 { margin: 0 0 10px 0; font-size: 1.1em; }
        .card-producto p { color: var(--accent); font-weight: bold; font-size: 1.2em; margin: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: var(--accent); color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { opacity: 0.9; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .btn-remove { background: #e74c3c; color: white; width: auto; padding: 5px 10px; font-size: 0.8em; }
    </style>
</head>
<body>
    <header>
        <h1>La Escondida - Toma de Órdenes</h1>
        <nav>
            <a href="index.html">Tomar Orden</a>
            <a href="cocina.html">Cocina</a>
            <a href="caja.html">Caja</a>
            <a href="inventario.html">Inventario</a>
            <a href="reportes.html">Reportes</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <div class="container">
        <div class="panel">
            <h2>Menú de Productos</h2>
            <div id="grid-productos" class="grid-productos">Cargando productos...</div>
        </div>

        <div class="panel">
            <h2>Orden Actual</h2>
            <div class="form-group">
                <label for="numero_mesa">Mesa o Datos de Entrega:</label>
                <input type="text" id="numero_mesa" placeholder="Ej: Mesa 4 o Domicilio: Calle 5 #12">
            </div>
            
            <h3>Carrito</h3>
            <ul id="lista-carrito">
                <p style="color: #888;">El carrito está vacío</p>
            </ul>
            
            <h3>Total: $<span id="total-orden">0.00</span></h3>
            <button onclick="enviarOrden()">Enviar Orden</button>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';
        let carrito = [];

        async function cargarProductos() {
            try {
                const res = await fetch(`${API_URL}/productos`);
                const productos = await res.json();
                const container = document.getElementById('grid-productos');
                container.innerHTML = '';

                productos.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'card-producto';
                    div.onclick = () => agregarAlCarrito(p);
                    div.innerHTML = `
                        <h3>${p.nombre}</h3>
                        <p>$${parseFloat(p.precio).toFixed(2)}</p>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error('Error al cargar productos:', err);
            }
        }

        function agregarAlCarrito(producto) {
            const existe = carrito.find(item => item.id_producto === producto.id_producto);
            if (existe) {
                existe.cantidad++;
            } else {
                carrito.push({
                    id_producto: producto.id_producto,
                    nombre: producto.nombre,
                    precio: parseFloat(producto.precio),
                    cantidad: 1
                });
            }
            actualizarCarritoUI();
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const ul = document.getElementById('lista-carrito');
            const totalEl = document.getElementById('total-orden');
            ul.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                ul.innerHTML = '<p style="color: #888;">El carrito está vacío</p>';
            } else {
                carrito.forEach((item, index) => {
                    total += item.precio * item.cantidad;
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <div>
                            <strong>${item.nombre}</strong> x ${item.cantidad}<br>
                            <small>$${(item.precio * item.cantidad).toFixed(2)}</small>
                        </div>
                        <button class="btn-remove" onclick="eliminarDelCarrito(${index})">X</button>
                    `;
                    ul.appendChild(li);
                });
            }
            totalEl.textContent = total.toFixed(2);
        }

        async function enviarOrden() {
            if (carrito.length === 0) {
                alert('Agrega al menos un producto a la orden');
                return;
            }

            const mesa = document.getElementById('numero_mesa').value.trim() || 'Mesa 1';
            const total = parseFloat(document.getElementById('total-orden').textContent);

            const payload = {
                numero_mesa: mesa,
                total: total,
                detalles: carrito
            };

            try {
                const res = await fetch(`${API_URL}/ordenes`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.mensaje);
                    carrito = [];
                    document.getElementById('numero_mesa').value = '';
                    actualizarCarritoUI();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('No se pudo enviar la orden al servidor');
            }
        }

        window.onload = cargarProductos;
    </script>
</body>
</html>
