<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Menú</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .header-bg { background-color: #4a2c2a; color: white; padding: 20px; }
        .card-prod { margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="header-bg text-center">
        <h1>☕ La Escondida</h1>
        <h5 id="label-mesa" class="text-warning">Ordenando...</h5>
    </div>

    <div class="container my-4">
        <h2>Nuestro Menú</h2>
        <div id="contenedor-menu" class="row my-3">
            <p class="text-muted">Cargando menú...</p>
        </div>
    </div>

    <div class="fixed-bottom bg-white border-top p-3 d-flex justify-content-between align-items-center shadow">
        <div>
            <strong id="total-txt">Total: $0.00</strong><br>
            <small id="cant-txt" class="text-muted">0 artículos</small>
        </div>
        <button class="btn btn-warning fw-bold" onclick="enviarOrden()">Enviar Orden</button>
    </div>

    <script>
        const API_BASE = 'https://backend-la-escondida.onrender.com';
        
        // Obtener número de mesa de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const mesa = urlParams.get('mesa') || '1';
        document.getElementById('label-mesa').innerText = `Ordenando desde: Mesa ${mesa}`;

        let carrito = [];

        function cargarProductos() {
            fetch(`${API_BASE}/productos`)
                .then(res => {
                    if (!res.ok) throw new Error('Error en el servidor');
                    return res.json();
                })
                .then(productos => {
                    const contenedor = document.getElementById('contenedor-menu');
                    contenedor.innerHTML = '';

                    if (productos.length === 0) {
                        contenedor.innerHTML = '<p class="text-muted">No hay productos registrados en el menú.</p>';
                        return;
                    }

                    productos.forEach(prod => {
                        contenedor.innerHTML += `
                            <div class="col-md-4 col-6 card-prod">
                                <div class="card h-100 shadow-sm">
                                    <div class="card-body d-flex flex-column justify-content-between">
                                        <div>
                                            <h5 class="card-title">${prod.nombre}</h5>
                                            <p class="card-text text-success fw-bold">$${parseFloat(prod.precio).toFixed(2)}</p>
                                        </div>
                                        <button class="btn btn-primary btn-sm mt-2" onclick="agregarAlCarrito(${prod.id_producto}, '${prod.nombre}', ${prod.precio})">
                                            + Agregar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                })
                .catch(err => {
                    console.error("Error al cargar productos:", err);
                    document.getElementById('contenedor-menu').innerHTML = '<p class="text-danger font-weight-bold">Error al conectar con el servidor.</p>';
                });
        }

        function agregarAlCarrito(id, nombre, precio) {
            const item = carrito.find(i => i.id_producto === id);
            if (item) {
                item.cantidad += 1;
            } else {
                carrito.push({ id_producto: id, nombre, precio: parseFloat(precio), cantidad: 1 });
            }
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            const total = carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0);
            const articulos = carrito.reduce((sum, item) => sum + item.cantidad, 0);

            document.getElementById('total-txt').innerText = `Total: $${total.toFixed(2)}`;
            document.getElementById('cant-txt').innerText = `${articulos} artículos`;
        }

        function enviarOrden() {
            if (carrito.length === 0) {
                alert('El carrito está vacío');
                return;
            }

            const payload = {
                numero_mesa: `Mesa ${mesa}`,
                total: carrito.reduce((sum, item) => sum + (item.precio * item.cantidad), 0),
                detalles: carrito
            };

            fetch(`${API_BASE}/ordenes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                alert('¡Orden enviada con éxito!');
                carrito = [];
                actualizarCarritoUI();
            })
            .catch(err => {
                alert('Ocurrió un error al enviar la orden');
                console.error(err);
            });
        }

        // Cargar menú al abrir la página
        cargarProductos();
    </script>
</body>
</html>
