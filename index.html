<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Menú de Pedidos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; display: flex; gap: 20px; }
        .productos { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .card { border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
        .carrito { flex: 1; border: 1px solid #333; padding: 15px; border-radius: 8px; background: #f9f9f9; }
        button { background: #28a745; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <h2>Menú de Productos</h2>
        <div id="contenedor-productos" class="productos"></div>
    </div>

    <div class="carrito">
        <h2>Mi Pedido</h2>
        <label>Número de Mesa:</label>
        <input type="number" id="numero-mesa" min="1" placeholder="Ej. 5" style="width: 100%; margin-bottom: 10px;">
        <ul id="lista-carrito"></ul>
        <h3>Total: $<span id="total-pedido">0.00</span></h3>
        <button onclick="enviarPedido()" style="width: 100%;">🚀 Enviar a Cocina</button>
    </div>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api'; // Reemplazar por tu URL
        let carrito = [];

        async function cargarProductos() {
            const res = await fetch(`${API_URL}/productos`);
            const productos = await res.json();
            const contenedor = document.getElementById('contenedor-productos');
            contenedor.innerHTML = '';

            productos.forEach(p => {
                contenedor.innerHTML += `
                    <div class="card">
                        <h3>${p.nombre}</h3>
                        <p>$${parseFloat(p.precio).toFixed(2)}</p>
                        <input type="text" id="nota-${p.id_producto}" placeholder="Notas (ej. sin cebolla)">
                        <button onclick="agregar(${p.id_producto}, '${p.nombre}', ${p.precio})">Agregar</button>
                    </div>
                `;
            });
        }

        function agregar(id, nombre, precio) {
            const nota = document.getElementById(`nota-${id}`).value;
            carrito.push({ id_producto: id, nombre, precio_unitario: precio, cantidad: 1, notas: nota });
            document.getElementById(`nota-${id}`).value = '';
            renderCarrito();
        }

        function renderCarrito() {
            const lista = document.getElementById('lista-carrito');
            lista.innerHTML = '';
            let total = 0;

            carrito.forEach((item, index) => {
                total += item.precio_unitario * item.cantidad;
                lista.innerHTML += `
                    <li>
                        ${item.nombre} - $${item.precio_unitario} 
                        ${item.notas ? `<small>(${item.notas})</small>` : ''}
                        <button onclick="eliminar(${index})" style="background:red; padding:2px 5px;">X</button>
                    </li>
                `;
            });
            document.getElementById('total-pedido').innerText = total.toFixed(2);
        }

        function eliminar(index) {
            carrito.splice(index, 1);
            renderCarrito();
        }

        async function enviarPedido() {
            const mesa = document.getElementById('numero-mesa').value;
            if (!mesa || carrito.length === 0) return alert('Ingresa la mesa y selecciona productos');

            const total = carrito.reduce((sum, i) => sum + i.precio_unitario, 0);

            const res = await fetch(`${API_URL}/ordenes`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numero_mesa: mesa, detalles: carrito, total })
            });

            if (res.ok) {
                alert('✅ Pedido enviado a cocina (Insumos descontados)');
                carrito = [];
                document.getElementById('numero-mesa').value = '';
                renderCarrito();
            }
        }

        cargarProductos();
    </script>
</body>
</html>
