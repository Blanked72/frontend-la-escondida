<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caja - Cobro de Órdenes</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
        button { background: #9c27b0; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>💵 Módulo de Caja</h2>
    <table>
        <thead>
            <tr>
                <th>N° Orden</th>
                <th>Mesa</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acción</th>
            </tr>
        </thead>
        <tbody id="tabla-caja"></tbody>
    </table>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function cargarCaja() {
            const res = await fetch(`${API_URL}/ordenes`);
            const ordenes = await res.json();
            
            const paraCobrar = ordenes.filter(o => o.estado === 'Entregado');
            const tbody = document.getElementById('tabla-caja');
            tbody.innerHTML = '';

            paraCobrar.forEach(o => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${o.id_orden}</td>
                        <td>Mesa ${o.numero_mesa}</td>
                        <td>$${parseFloat(o.total).toFixed(2)}</td>
                        <td><b style="color:green;">${o.estado}</b></td>
                        <td><button onclick="cobrar(${o.id_orden})">💳 Cobrar y Finalizar</button></td>
                    </tr>
                `;
            });
        }

        async function cobrar(id) {
            await fetch(`${API_URL}/ordenes/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'Pagado' })
            });
            cargarCaja();
        }

        setInterval(cargarCaja, 5000);
        cargarCaja();
    </script>
</body>
</html>
