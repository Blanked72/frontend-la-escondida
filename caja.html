<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja / Punto de Venta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ecf0f1; color: #2c3e50; margin: 0; padding: 1rem; }
        h1 { text-align: center; color: #2980b9; }
        .grid-caja { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .ticket { background-color: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-left: 5px solid #2980b9; }
        .ticket h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .total { font-size: 1.5rem; font-weight: bold; color: #c0392b; margin: 15px 0; }
        .btn-cobrar { background-color: #3498db; color: white; border: none; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-cobrar:hover { background-color: #2980b9; }
        .btn-cobrar:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .ticket.rechazada { border-left-color: #e74c3c; }
        .motivo-rechazo { background-color: #fdecea; color: #c0392b; font-weight: bold; padding: 8px; border-radius: 4px; margin: 10px 0; font-size: 0.95rem; }
        .btn-notificado { background-color: #34495e; color: white; border: none; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-notificado:hover { background-color: #2c3e50; }
    </style>
</head>
<body>

    <h1>💰 Punto de Venta (Caja)</h1>
    <div id="pantalla-caja" class="grid-caja">
        <p>Buscando órdenes listas para cobrar...</p>
    </div>

    <script>
        // BANDERA STRICTA ANTI-DOBLE PROCESAMIENTO
        let procesandoPago = false;

        async function cargarOrdenesCaja() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/caja');
                const datos = await respuesta.json();
                
                const pantalla = document.getElementById('pantalla-caja');
                pantalla.innerHTML = ''; 

                if (datos.length === 0) {
                    pantalla.innerHTML = '<p>No hay cuentas pendientes por cobrar.</p>';
                    return;
                }

                datos.forEach(orden => {
                    const ticket = document.createElement('div');

                    if (orden.estado === 'Rechazada') {
                        ticket.className = 'ticket rechazada';
                        ticket.innerHTML = `
                            <h2>Orden #${orden.id_orden} - Mesa ${orden.numero_mesa}</h2>
                            <div class="motivo-rechazo">⚠️ Cocina no pudo prepararla: ${orden.motivo_rechazo || 'Falta de insumo'}</div>
                            <button class="btn-notificado" onclick="notificarRechazo(${orden.id_orden})">
                                ✅ Ya avisé al cliente
                            </button>
                        `;
                    } else {
                        ticket.className = 'ticket';
                        ticket.innerHTML = `
                            <h2>Orden #${orden.id_orden} - Mesa ${orden.numero_mesa}</h2>
                            <div class="total">Total: $${orden.total}</div>
                            <button class="btn-cobrar" id="btn-${orden.id_orden}" onclick="cobrarOrden(event, ${orden.id_orden}, ${orden.total})">
                                💵 Cobrar
                            </button>
                        `;
                    }

                    pantalla.appendChild(ticket);
                });
            } catch (error) {
                console.error("Error conectando con la caja:", error);
            }
        }

        async function cobrarOrden(event, id_orden, total) {
            // Detener cualquier evento duplicado
            if (event) event.preventDefault();

            // Si ya hay un cobro en curso, ignorar cualquier segundo clic
            if (procesandoPago) return;

            const confirmar = confirm(`¿Confirmas el cobro de $${total} por la Orden #${id_orden}?`);
            if (!confirmar) return;

            // Bloqueo inmediato
            procesandoPago = true;
            const boton = document.getElementById(`btn-${id_orden}`);
            if (boton) {
                boton.disabled = true;
                boton.innerText = "⏳ Procesando...";
            }

            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/pagar`, {
                    method: 'PUT'
                });
                
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    alert(resultado.mensaje || "Cobro procesado correctamente.");
                    await cargarOrdenesCaja();
                } else {
                    alert(`El servidor falló al cobrar: ${resultado.error || 'Error desconocido'}`);
                    if (boton) {
                        boton.disabled = false;
                        boton.innerText = "💵 Cobrar";
                    }
                }
            } catch (error) {
                alert("Hubo un error de red al procesar el pago. Verifica tu conexión.");
                if (boton) {
                    boton.disabled = false;
                    boton.innerText = "💵 Cobrar";
                }
            } finally {
                // Liberar bandera
                procesandoPago = false;
            }
        }

        cargarOrdenesCaja();
        setInterval(cargarOrdenesCaja, 5000);

        async function notificarRechazo(id_orden) {
            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/notificar-rechazo`, {
                    method: 'PUT'
                });

                if (respuesta.ok) {
                    await cargarOrdenesCaja();
                } else {
                    alert("No se pudo actualizar la orden.");
                }
            } catch (error) {
                alert("Hubo un error de red al actualizar la orden.");
            }
        }
    </script>
</body>
</html>
