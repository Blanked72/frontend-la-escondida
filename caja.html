<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja / Punto de Venta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #ecf0f1; color: #2c3e50; margin: 0; padding: 1rem; }
        h1 { text-align: center; color: #2980b9; }
        .logo-icon { height: 80px; vertical-align: middle; margin-right: 8px; }
        .grid-caja { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .ticket { background-color: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); border-left: 5px solid #2980b9; }
        .ticket h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
        .total { font-size: 1.5rem; font-weight: bold; color: #c0392b; margin: 15px 0; }
        .btn-cobrar { background-color: #3498db; color: white; border: none; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-cobrar:hover { background-color: #2980b9; }
        .btn-cobrar:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .ticket.rechazada { border-left-color: #e74c3c; }
        .motivo-rechazo { background-color: #fdecea; color: #c0392b; font-weight: bold; padding: 8px; border-radius: 4px; margin: 10px 0; font-size: 0.95rem; }
        .btn-notificado { background-color: #34495e; color: white; border: none; padding: 12px; width: 100%; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; }
        .btn-notificado:hover { background-color: #2c3e50; }
        .info-cliente { background-color: #eaf2f8; color: #2c3e50; padding: 8px; border-radius: 4px; margin: 5px 0 10px; font-size: 0.95rem; }
        .btn-imprimir { background-color: #7f8c8d; color: white; border: none; padding: 10px; width: 100%; font-size: 1rem; font-weight: bold; cursor: pointer; border-radius: 4px; margin-top: 8px; }
        .btn-imprimir:hover { background-color: #6c7a7a; }
    </style>
</head>
<body>

    <h1><img src="logo.png" alt="La Escondida" class="logo-icon">💰 Punto de Venta (Caja)</h1>
    <div id="pantalla-caja" class="grid-caja">
        <p>Buscando órdenes listas para cobrar...</p>
    </div>

    <script>
        // BANDERA STRICTA ANTI-DOBLE PROCESAMIENTO
        let procesandoPago = false;

        async function cargarOrdenesCaja() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/caja');
                const datos = await respuesta.json();
                
                const pantalla = document.getElementById('pantalla-caja');
                pantalla.innerHTML = ''; 

                if (datos.length === 0) {
                    pantalla.innerHTML = '<p>No hay cuentas pendientes por cobrar.</p>';
                    return;
                }

                datos.forEach(orden => {
                    const ticket = document.createElement('div');

                    const origen = orden.tipo_pedido === 'domicilio' ? '🚚 A domicilio'
                        : orden.tipo_pedido === 'recoger' ? '🛍️ Para recoger'
                        : `Mesa ${orden.numero_mesa}${orden.para_llevar ? ' · 🥡 Para llevar' : ''}`;

                    const htmlInfoCliente = orden.tipo_pedido && orden.tipo_pedido !== 'mesa'
                        ? `<div class="info-cliente">👤 ${orden.nombre_cliente} | 📞 ${orden.telefono}${orden.tipo_pedido === 'domicilio' ? ' | 📍 ' + orden.direccion : ''}</div>`
                        : '';

                    if (orden.estado === 'Rechazada') {
                        ticket.className = 'ticket rechazada';
                        ticket.innerHTML = `
                            <h2>Orden #${orden.numero_dia} - ${origen}</h2>
                            ${htmlInfoCliente}
                            <div class="motivo-rechazo">⚠️ Cocina no pudo prepararla: ${orden.motivo_rechazo || 'Falta de insumo'}</div>
                            <button class="btn-notificado" onclick="notificarRechazo(${orden.id_orden})">
                                ✅ Ya avisé al cliente
                            </button>
                        `;
                    } else {
                        ticket.className = 'ticket';
                        ticket.innerHTML = `
                            <h2>Orden #${orden.numero_dia} - ${origen}</h2>
                            ${htmlInfoCliente}
                            <div class="total">Total: $${orden.total}</div>
                            <button class="btn-cobrar" id="btn-${orden.id_orden}" onclick="cobrarOrden(event, ${orden.id_orden}, ${orden.total})">
                                💵 Cobrar
                            </button>
                            <button class="btn-imprimir" onclick="imprimirTicket(${orden.id_orden})">
                                🖨️ Imprimir ticket
                            </button>
                        `;
                    }

                    pantalla.appendChild(ticket);
                });
            } catch (error) {
                console.error("Error conectando con la caja:", error);
            }
        }

        async function cobrarOrden(event, id_orden, total) {
            // Detener cualquier evento duplicado
            if (event) event.preventDefault();

            // Si ya hay un cobro en curso, ignorar cualquier segundo clic
            if (procesandoPago) return;

            const confirmar = confirm(`¿Confirmas el cobro de $${total} por la Orden #${id_orden}?`);
            if (!confirmar) return;

            // Bloqueo inmediato
            procesandoPago = true;
            const boton = document.getElementById(`btn-${id_orden}`);
            if (boton) {
                boton.disabled = true;
                boton.innerText = "⏳ Procesando...";
            }

            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/pagar`, {
                    method: 'PUT'
                });
                
                const resultado = await respuesta.json();
                
                if (respuesta.ok) {
                    alert(resultado.mensaje || "Cobro procesado correctamente.");
                    await cargarOrdenesCaja();
                } else {
                    alert(`El servidor falló al cobrar: ${resultado.error || 'Error desconocido'}`);
                    if (boton) {
                        boton.disabled = false;
                        boton.innerText = "💵 Cobrar";
                    }
                }
            } catch (error) {
                alert("Hubo un error de red al procesar el pago. Verifica tu conexión.");
                if (boton) {
                    boton.disabled = false;
                    boton.innerText = "💵 Cobrar";
                }
            } finally {
                // Liberar bandera
                procesandoPago = false;
            }
        }

        cargarOrdenesCaja();
        setInterval(cargarOrdenesCaja, 5000);

        async function notificarRechazo(id_orden) {
            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/notificar-rechazo`, {
                    method: 'PUT'
                });

                if (respuesta.ok) {
                    await cargarOrdenesCaja();
                } else {
                    alert("No se pudo actualizar la orden.");
                }
            } catch (error) {
                alert("Hubo un error de red al actualizar la orden.");
            }
        }

        async function imprimirTicket(id_orden) {
            try {
                const respuesta = await fetch(`https://backend-la-escondida.onrender.com/api/ordenes/${id_orden}/detalle`);
                const datos = await respuesta.json();

                if (!respuesta.ok) {
                    alert(datos.error || "No se pudo obtener el detalle de la orden.");
                    return;
                }

                const { orden, items } = datos;
                const origen = orden.tipo_pedido === 'domicilio' ? 'A domicilio'
                    : orden.tipo_pedido === 'recoger' ? 'Para recoger'
                    : `Mesa ${orden.numero_mesa}${orden.para_llevar ? ' - Para llevar' : ''}`;

                let filasItems = '';
                items.forEach(item => {
                    const subtotal = (item.cantidad * item.precio_unitario).toFixed(2);
                    const notaHtml = item.nota ? `<span class="nota-item">${item.nota}</span>` : '';
                    filasItems += `
                        <tr>
                            <td>${item.cantidad}x ${item.nombre}${notaHtml}</td>
                            <td class="precio-item">$${subtotal}</td>
                        </tr>
                    `;
                });

                if (orden.tipo_pedido === 'domicilio') {
                    filasItems += `
                        <tr>
                            <td>Costo de envío</td>
                            <td class="precio-item">$20.00</td>
                        </tr>
                    `;
                }

                const infoCliente = orden.tipo_pedido !== 'mesa'
                    ? `<div class="info-cliente-ticket">${orden.nombre_cliente || ''} · ${orden.telefono || ''}${orden.direccion ? '<br>' + orden.direccion : ''}</div>`
                    : '';

                const fechaImpresion = new Date().toLocaleString('es-MX', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                // URL absoluta del logo (la ventana de impresión no hereda la ruta de la página actual)
                const logoUrl = new URL('logo.png', window.location.href).href;

                const ventana = window.open('', '_blank', 'width=380,height=650');
                ventana.document.write(`
                    <html>
                    <head>
                        <title>Ticket Orden #${orden.numero_dia}</title>
                        <style>
                            @page { size: 80mm auto; margin: 0; }
                            * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            body { font-family: 'Courier New', monospace; color: #000; width: 76mm; margin: 0 auto; padding: 4mm 3mm; }
                            .logo-ticket { display: block; margin: 0 auto 10px; height: 85px; }
                            .nombre-negocio { text-align: center; font-family: Arial, sans-serif; font-size: 1.3rem; font-weight: bold; letter-spacing: 1px; margin: 0; color: #000; }
                            .subtitulo { text-align: center; font-family: Arial, sans-serif; font-size: 0.8rem; color: #000; margin: 2px 0 12px; }
                            .info-orden { text-align: center; font-size: 1rem; font-weight: bold; margin: 6px 0 2px; color: #000; }
                            .fecha-ticket { text-align: center; font-size: 0.8rem; color: #000; margin: 0 0 6px; }
                            .info-cliente-ticket { text-align: center; font-size: 0.85rem; color: #000; margin: 4px 0; font-weight: bold; }
                            .linea { border-top: 2px dashed #000; margin: 12px 0; }
                            table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
                            td { padding: 6px 0; vertical-align: top; color: #000; font-weight: bold; }
                            .precio-item { text-align: right; white-space: nowrap; padding-left: 10px; }
                            .nota-item { display: block; font-style: italic; color: #000; font-size: 0.78rem; margin-top: 2px; font-weight: normal; }
                            .fila-total { display: flex; justify-content: space-between; align-items: center; font-family: Arial, sans-serif; font-size: 1.25rem; font-weight: bold; margin-top: 10px; padding-top: 10px; border-top: 3px solid #000; color: #000; }
                            .footer-ticket { text-align: center; font-family: Arial, sans-serif; font-size: 0.85rem; color: #000; margin-top: 22px; margin-bottom: 0; font-weight: bold; }
                            @media print { body { padding: 4mm 3mm; } }
                        </style>
                    </head>
                    <body>
                        <img class="logo-ticket" src="${logoUrl}" alt="La Escondida">
                        <div class="nombre-negocio">LA ESCONDIDA</div>
                        <div class="subtitulo">Cafetería y más...</div>
                        <div class="linea"></div>
                        <div class="info-orden">Orden #${orden.numero_dia} · ${origen}</div>
                        <div class="fecha-ticket">${fechaImpresion}</div>
                        ${infoCliente}
                        <div class="linea"></div>
                        <table>${filasItems}</table>
                        <div class="linea"></div>
                        <div class="fila-total"><span>TOTAL</span><span>$${parseFloat(orden.total).toFixed(2)}</span></div>
                        <div class="footer-ticket">¡Gracias por tu preferencia! ☕</div>
                    </body>
                    </html>
                `);
                ventana.document.close();

                // Cerramos la ventana sola al terminar de imprimir (o al cancelar),
                // para que el siguiente ticket abra una ventana limpia
                ventana.onafterprint = () => ventana.close();
                ventana.focus();

                // Esperamos a que el logo termine de cargar antes de imprimir; si no, el ticket
                // sale sin logo cuando la imagen tarda más de lo que tarda en dispararse print()
                const imgLogo = ventana.document.querySelector('.logo-ticket');
                let yaImprimio = false;
                function imprimirUnaVez() {
                    if (yaImprimio) return;
                    yaImprimio = true;
                    ventana.print();
                }

                if (imgLogo && !imgLogo.complete) {
                    imgLogo.onload = imprimirUnaVez;
                    imgLogo.onerror = imprimirUnaVez; // Si el logo falla, igual imprimimos el resto del ticket
                    setTimeout(imprimirUnaVez, 2000); // Seguro por si el evento de carga nunca dispara
                } else {
                    imprimirUnaVez();
                }
            } catch (error) {
                alert("Hubo un error al generar el ticket.");
            }
        }
    </script>
</body>
</html>
