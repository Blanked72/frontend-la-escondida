<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 2rem; }
        h1 { text-align: center; color: #2c3e50; }
        .logo-icon { height: 40px; vertical-align: middle; margin-right: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #3498db; text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 1.3rem; }
        .cantidad { font-size: 2.5rem; font-weight: bold; color: #e67e22; margin: 10px 0; }
        .card.stock-bajo { border-left-color: #e74c3c; }
        .card.stock-bajo .cantidad { color: #e74c3c; }
        .banner-alerta { background-color: #fdecea; color: #c0392b; border: 2px solid #e74c3c; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-weight: bold; text-align: center; }
        .btn-actualizar { display: block; margin: 3rem auto 0; background-color: #34495e; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; }
        .btn-actualizar:hover { background-color: #2c3e50; }
    </style>
</head>
<body>

    <h1><img src="logo.png" alt="La Escondida" class="logo-icon">📦 Stock e Inventario</h1>

    <button id="btn-activar-sonido" class="btn-actualizar" onclick="activarSonido()" style="margin-top: 0; margin-bottom: 1.5rem;">
        🔔 Activar sonido de alertas
    </button>

    <div id="banner-alerta"></div>

    <div id="grid-inventario" class="grid">
        <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Buscando insumos en la base de datos...</p>
    </div>

    <button class="btn-actualizar" onclick="cargarInventario()">🔄 Actualizar Stock</button>

    <script>
        // En celulares el navegador bloquea el audio hasta que el usuario toca la pantalla,
        // por eso el AudioContext se crea con el botón "Activar sonido" y se reutiliza aquí.
        let contextoAudio = null;

        function activarSonido() {
            try {
                contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
                contextoAudio.resume();
                const boton = document.getElementById('btn-activar-sonido');
                boton.innerText = '🔔 Sonido activado';
                boton.disabled = true;
            } catch (error) {
                console.error("No se pudo activar el audio:", error);
            }
        }

        function reproducirSonidoAlerta() {
            if (!contextoAudio) return; // El usuario aún no presionó "Activar sonido"

            try {
                const duracion = 0.5;
                const bufferSize = contextoAudio.sampleRate * duracion;
                const buffer = contextoAudio.createBuffer(1, bufferSize, contextoAudio.sampleRate);
                const datos = buffer.getChannelData(0);

                // Ruido blanco con caída rápida = "chasquido"
                for (let i = 0; i < bufferSize; i++) {
                    datos[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 3);
                }

                const fuente = contextoAudio.createBufferSource();
                fuente.buffer = buffer;

                // Filtro que baja de agudo a grave para simular el "crack" del látigo
                const filtro = contextoAudio.createBiquadFilter();
                filtro.type = 'bandpass';
                filtro.frequency.setValueAtTime(3500, contextoAudio.currentTime);
                filtro.frequency.exponentialRampToValueAtTime(400, contextoAudio.currentTime + duracion);
                filtro.Q.value = 1;

                const volumen = contextoAudio.createGain();
                volumen.gain.setValueAtTime(1, contextoAudio.currentTime);
                volumen.gain.exponentialRampToValueAtTime(0.01, contextoAudio.currentTime + duracion);

                fuente.connect(filtro);
                filtro.connect(volumen);
                volumen.connect(contextoAudio.destination);

                fuente.start();
            } catch (error) {
                console.error("No se pudo reproducir el sonido de alerta:", error);
            }
        }

        async function cargarInventario() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/insumos');
                const insumos = await respuesta.json();
                
                const grid = document.getElementById('grid-inventario');
                const banner = document.getElementById('banner-alerta');
                grid.innerHTML = ''; 

                if(insumos.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">No hay insumos registrados en la base de datos.</p>';
                    banner.innerHTML = '';
                    return;
                }

                const insumosBajos = [];

                insumos.forEach(insumo => {
                    const nombre = insumo.nombre || 'Insumo Desconocido';
                    const cantidad = insumo.cantidad_actual || 0;
                    const minimo = insumo.stock_minimo ?? 5;
                    const esBajo = cantidad <= minimo;

                    if (esBajo) insumosBajos.push(nombre);

                    const card = document.createElement('div');
                    card.className = esBajo ? 'card stock-bajo' : 'card';
                    card.innerHTML = `
                        <h3>${nombre}</h3>
                        <div class="cantidad">${cantidad}</div>
                    `;
                    grid.appendChild(card);
                });

                if (insumosBajos.length > 0) {
                    banner.innerHTML = `<div class="banner-alerta">⚠️ Stock bajo en: ${insumosBajos.join(', ')}</div>`;
                    reproducirSonidoAlerta();
                } else {
                    banner.innerHTML = '';
                }
            } catch (error) {
                console.error("Error al cargar inventario:", error);
                document.getElementById('grid-inventario').innerHTML = '<p style="color:red; text-align:center; width: 100%; grid-column: 1 / -1;">Error al conectar con el servidor.</p>';
            }
        }

        // Cargar automáticamente al entrar a la página y revisar cada 10 segundos
        cargarInventario();
        setInterval(cargarInventario, 10000);
    </script>
</body>
</html>
