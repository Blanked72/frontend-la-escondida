<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; color: #333; margin: 0; padding: 2rem; }
        h1 { text-align: center; color: #2c3e50; }
        .logo-icon { height: 80px; vertical-align: middle; margin-right: 8px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
        .card { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-left: 5px solid #3498db; text-align: center; }
        .card h3 { margin: 0 0 10px 0; color: #2c3e50; font-size: 1.3rem; }
        .cantidad { font-size: 2.5rem; font-weight: bold; color: #e67e22; margin: 10px 0; }
        .card.stock-bajo { border-left-color: #e74c3c; }
        .card.stock-bajo .cantidad { color: #e74c3c; }
        .card.stock-ok { border-left-color: #27ae60; }
        .card.stock-ok .cantidad { color: #27ae60; }
        .banner-alerta { background-color: #fdecea; color: #c0392b; border: 2px solid #e74c3c; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; font-weight: bold; text-align: center; }
        .btn-actualizar { display: block; margin: 3rem auto 0; background-color: #34495e; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; }
        .btn-actualizar:hover { background-color: #2c3e50; }

        .selector-vista { display: flex; justify-content: center; gap: 10px; margin-bottom: 1.5rem; }
        .btn-vista { background-color: white; border: 2px solid #ccc; color: #555; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .btn-vista.activo { background-color: #34495e; border-color: #34495e; color: white; }

        table.lista-inventario { width: 100%; border-collapse: collapse; margin-top: 1rem; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table.lista-inventario th { background-color: #34495e; color: white; padding: 12px; text-align: left; }
        table.lista-inventario td { padding: 10px 12px; border-bottom: 1px solid #eee; }
        table.lista-inventario tr.fila-bajo { background-color: #fdecea; }
        table.lista-inventario tr.fila-ok td.col-cantidad { color: #27ae60; font-weight: bold; }
        table.lista-inventario tr.fila-bajo td.col-cantidad { color: #e74c3c; font-weight: bold; }
    </style>
</head>
<body>

    <h1><img src="logo.png" alt="La Escondida" class="logo-icon">📦 Stock e Inventario</h1>

    <button id="btn-activar-sonido" class="btn-actualizar" onclick="activarSonido()" style="margin-top: 0; margin-bottom: 1.5rem;">
        🔔 Activar sonido de alertas
    </button>

    <div id="banner-alerta"></div>

    <div class="selector-vista">
        <button id="btn-vista-tarjetas" class="btn-vista" onclick="cambiarVista('tarjetas')">🔲 Tarjetas</button>
        <button id="btn-vista-lista" class="btn-vista" onclick="cambiarVista('lista')">📋 Lista</button>
    </div>

    <div id="grid-inventario" class="grid">
        <p style="text-align: center; width: 100%; grid-column: 1 / -1;">Buscando insumos en la base de datos...</p>
    </div>

    <table id="lista-inventario" class="lista-inventario" style="display: none;">
        <thead>
            <tr>
                <th>Insumo</th>
                <th>Stock Actual</th>
                <th>Stock Mínimo</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="cuerpo-lista-inventario"></tbody>
    </table>

    <button class="btn-actualizar" onclick="cargarInventario()">🔄 Actualizar Stock</button>
    <button class="btn-actualizar" style="background-color: #8e44ad;" onclick="descargarPDF()">📄 Descargar PDF del inventario</button>

    <script>
        // En celulares el navegador bloquea el audio hasta que el usuario toca la pantalla,
        // por eso el AudioContext se crea y el audio se precarga con el botón "Activar sonido".
        let contextoAudio = null;
        let bufferSonidoAlerta = null;

        async function activarSonido() {
            try {
                contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
                contextoAudio.resume();

                const respuesta = await fetch('alerta.mp3');
                const datosArray = await respuesta.arrayBuffer();
                bufferSonidoAlerta = await contextoAudio.decodeAudioData(datosArray);

                const boton = document.getElementById('btn-activar-sonido');
                boton.innerText = '🔔 Sonido activado';
                boton.disabled = true;
            } catch (error) {
                console.error("No se pudo activar el audio:", error);
            }
        }

        function reproducirSonidoAlerta() {
            if (!contextoAudio || !bufferSonidoAlerta) return; // El usuario aún no presionó "Activar sonido"

            try {
                const fuente = contextoAudio.createBufferSource();
                fuente.buffer = bufferSonidoAlerta;
                fuente.connect(contextoAudio.destination);
                fuente.start();
            } catch (error) {
                console.error("No se pudo reproducir el sonido de alerta:", error);
            }
        }

        async function cargarInventario() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/insumos');
                const insumos = await respuesta.json();
                
                const grid = document.getElementById('grid-inventario');
                const cuerpoLista = document.getElementById('cuerpo-lista-inventario');
                const banner = document.getElementById('banner-alerta');
                grid.innerHTML = '';
                cuerpoLista.innerHTML = '';

                if(insumos.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; width: 100%; grid-column: 1 / -1;">No hay insumos registrados en la base de datos.</p>';
                    cuerpoLista.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay insumos registrados en la base de datos.</td></tr>';
                    banner.innerHTML = '';
                    return;
                }

                const insumosBajos = [];

                insumos.forEach(insumo => {
                    const nombre = insumo.nombre || 'Insumo Desconocido';
                    const cantidad = insumo.cantidad_actual || 0;
                    const minimo = insumo.stock_minimo ?? 5;
                    const esBajo = cantidad < minimo;

                    if (esBajo) insumosBajos.push(nombre);

                    // Vista de tarjetas
                    const card = document.createElement('div');
                    card.className = esBajo ? 'card stock-bajo' : 'card stock-ok';
                    card.innerHTML = `
                        <h3>${nombre}</h3>
                        <div class="cantidad">${cantidad}</div>
                    `;
                    grid.appendChild(card);

                    // Vista de lista
                    const fila = document.createElement('tr');
                    fila.className = esBajo ? 'fila-bajo' : 'fila-ok';
                    fila.innerHTML = `
                        <td>${nombre}</td>
                        <td class="col-cantidad">${cantidad}</td>
                        <td>${minimo}</td>
                        <td>${esBajo ? '⚠️ Bajo' : '✅ OK'}</td>
                    `;
                    cuerpoLista.appendChild(fila);
                });

                if (insumosBajos.length > 0) {
                    banner.innerHTML = `<div class="banner-alerta">⚠️ Stock bajo en: ${insumosBajos.join(', ')}</div>`;
                    reproducirSonidoAlerta();
                } else {
                    banner.innerHTML = '';
                }
            } catch (error) {
                console.error("Error al cargar inventario:", error);
                document.getElementById('grid-inventario').innerHTML = '<p style="color:red; text-align:center; width: 100%; grid-column: 1 / -1;">Error al conectar con el servidor.</p>';
            }
        }

        function cambiarVista(vista) {
            const grid = document.getElementById('grid-inventario');
            const lista = document.getElementById('lista-inventario');
            const btnTarjetas = document.getElementById('btn-vista-tarjetas');
            const btnLista = document.getElementById('btn-vista-lista');

            if (vista === 'lista') {
                grid.style.display = 'none';
                lista.style.display = 'table';
                btnLista.classList.add('activo');
                btnTarjetas.classList.remove('activo');
            } else {
                grid.style.display = 'grid';
                lista.style.display = 'none';
                btnTarjetas.classList.add('activo');
                btnLista.classList.remove('activo');
            }
            localStorage.setItem('inventario_vista', vista);
        }

        // Cargar automáticamente al entrar a la página y revisar cada 10 segundos
        cambiarVista(localStorage.getItem('inventario_vista') || 'tarjetas');
        cargarInventario();
        setInterval(cargarInventario, 10000);

        async function descargarPDF() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/insumos');
                const insumos = await respuesta.json();

                if (!Array.isArray(insumos) || insumos.length === 0) {
                    alert("No hay insumos para exportar.");
                    return;
                }

                const fecha = new Date().toLocaleString('es-MX', {
                    day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                const logoUrl = new URL('logo.png', window.location.href).href;

                let filas = '';
                insumos.forEach(insumo => {
                    const nombre = insumo.nombre || 'Insumo Desconocido';
                    const cantidad = insumo.cantidad_actual ?? 0;
                    const minimo = insumo.stock_minimo ?? 5;
                    const esBajo = cantidad < minimo;
                    const estado = esBajo ? '⚠️ Bajo' : '✅ OK';
                    filas += `
                        <tr class="${esBajo ? 'fila-bajo' : ''}">
                            <td>${nombre}</td>
                            <td class="centrado">${cantidad}</td>
                            <td class="centrado">${minimo}</td>
                            <td class="centrado">${estado}</td>
                        </tr>
                    `;
                });

                const ventana = window.open('', '_blank', 'width=700,height=800');
                ventana.document.write(`
                    <html>
                    <head>
                        <title>Inventario - La Escondida</title>
                        <style>
                            * { box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
                            body { font-family: Arial, sans-serif; color: #000; padding: 30px; }
                            .encabezado { text-align: center; margin-bottom: 20px; }
                            .encabezado img { height: 70px; display: block; margin: 0 auto 8px; }
                            .encabezado h1 { margin: 0; font-size: 1.5rem; color: #000; }
                            .encabezado p { margin: 4px 0 0; color: #000; font-size: 0.9rem; }
                            table { width: 100%; border-collapse: collapse; margin-top: 20px; }
                            th, td { border: 1px solid #333; padding: 8px 10px; text-align: left; font-size: 0.95rem; }
                            th { background-color: #4a2c2a; color: #fff; }
                            .centrado { text-align: center; }
                            .fila-bajo { background-color: #fdecea; font-weight: bold; }
                            @media print { body { padding: 10px; } }
                        </style>
                    </head>
                    <body>
                        <div class="encabezado">
                            <img src="${logoUrl}" alt="La Escondida">
                            <h1>Inventario de Insumos</h1>
                            <p>Generado el ${fecha}</p>
                        </div>
                        <table>
                            <thead>
                                <tr>
                                    <th>Insumo</th>
                                    <th class="centrado">Stock Actual</th>
                                    <th class="centrado">Stock Mínimo</th>
                                    <th class="centrado">Estado</th>
                                </tr>
                            </thead>
                            <tbody>${filas}</tbody>
                        </table>
                    </body>
                    </html>
                `);
                ventana.document.close();
                ventana.onafterprint = () => ventana.close();
                ventana.focus();
                ventana.print();
            } catch (error) {
                alert("Hubo un error al generar el PDF.");
            }
        }
    </script>
</body>
</html>
