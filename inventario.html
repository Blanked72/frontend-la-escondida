<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario de Insumos</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .bajo-stock { background-color: #ffcdd2; color: #b71c1c; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #333; color: white; }
    </style>
</head>
<body>
    <h2>📦 Gestión de Inventario</h2>

    <div>
        <h3>Agregar Insumo</h3>
        <input type="text" id="insumo-nombre" placeholder="Nombre del Insumo">
        <input type="number" step="0.01" id="insumo-stock" placeholder="Cantidad Inicial">
        <input type="number" step="0.01" id="insumo-min" placeholder="Stock Mínimo">
        <button onclick="agregarInsumo()" style="background:#28a745; color:white; border:none; padding:8px;">Agregar Insumo</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Insumo</th>
                <th>Cantidad Actual</th>
                <th>Stock Mínimo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="tabla-insumos"></tbody>
    </table>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function cargarInsumos() {
            const res = await fetch(`${API_URL}/insumos`);
            const insumos = await res.json();
            const tbody = document.getElementById('tabla-insumos');
            tbody.innerHTML = '';

            insumos.forEach(i => {
                const alerta = parseFloat(i.cantidad_actual) <= parseFloat(i.stock_minimo);
                tbody.innerHTML += `
                    <tr class="${alerta ? 'bajo-stock' : ''}">
                        <td>${i.id_insumo}</td>
                        <td>${i.nombre}</td>
                        <td>${i.cantidad_actual}</td>
                        <td>${i.stock_minimo}</td>
                        <td>${alerta ? '⚠️ STOCK BAJO' : '✅ SUFICIENTE'}</td>
                        <td>
                            <button onclick="eliminarInsumo(${i.id_insumo})" style="background:red; color:white; border:none; padding:5px;">Eliminar</button>
                        </td>
                    </tr>
                `;
            });
        }

        async function agregarInsumo() {
            const body = {
                nombre: document.getElementById('insumo-nombre').value,
                cantidad_actual: document.getElementById('insumo-stock').value,
                stock_minimo: document.getElementById('insumo-min').value
            };
            await fetch(`${API_URL}/insumos`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            cargarInsumos();
        }

        async function eliminarInsumo(id) {
            if (confirm('¿Eliminar insumo?')) {
                await fetch(`${API_URL}/insumos/${id}`, { method: 'DELETE' });
                cargarInsumos();
            }
        }

        cargarInsumos();
    </script>
</body>
</html>
