<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración / Inventario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f7; color: #2c3e50; margin: 0; padding: 20px; }
        h1 { color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #3498db; color: white; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-add { background-color: #2ecc71; color: white; }
        .btn-sub { background-color: #e74c3c; color: white; margin-left: 5px; }
        .btn-submit { background-color: #3498db; color: white; width: 100%; padding: 10px; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <h1>⚙️ Panel de Control - Inventario e Insumos</h1>

    <div class="grid">
        <!-- SECCIÓN: LISTA DE INSUMOS -->
        <div class="card">
            <h2>📦 Inventario de Insumos</h2>
            <table>
                <thead>
                    <tr>
                        <th>Insumo</th>
                        <th>Cantidad Actual</th>
                        <th>Ajustar Stock</th>
                    </tr>
                </thead>
                <tbody id="tabla-insumos">
                    <tr><td colspan="3">Cargando insumos...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- SECCIÓN: REGISTRAR NUEVO INSUMO -->
        <div class="card">
            <h2>➕ Nuevo Insumo</h2>
            <form id="form-insumo">
                <div class="form-group">
                    <label>Nombre del Insumo:</label>
                    <input type="text" id="nombre-insumo" placeholder="Ej. Pan de Hamburguesa" required>
                </div>
                <div class="form-group">
                    <label>Cantidad Inicial:</label>
                    <input type="number" step="0.01" id="cantidad-insumo" placeholder="Ej. 50" required>
                </div>
                <button type="submit" class="btn-submit">Guardar Insumo</button>
            </form>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend-la-escondida.onrender.com/api';

        // Cargar tabla de insumos
        async function cargarInsumos() {
            try {
                const res = await fetch(`${API_URL}/insumos`);
                const insumos = await res.json();

                const tbody = document.getElementById('tabla-insumos');
                tbody.innerHTML = '';

                if (insumos.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No hay insumos registrados.</td></tr>';
                    return;
                }

                insumos.forEach(insumo => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${insumo.nombre}</strong></td>
                        <td>${insumo.cantidad_actual}</td>
                        <td>
                            <button class="btn-add" onclick="modificarStock(${insumo.id_insumo}, '${insumo.nombre}', false)">➕ Sumar</button>
                            <button class="btn-sub" onclick="modificarStock(${insumo.id_insumo}, '${insumo.nombre}', true)">➖ Restar</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error("Error al cargar insumos:", error);
            }
        }

        // Función para ajustar stock (+ o -)
        async function modificarStock(id_insumo, nombre, esResta) {
            const accion = esResta ? "RESTAR" : "SUMAR";
            const valorInput = prompt(`¿Qué cantidad deseas ${accion} al insumo "${nombre}"?`);

            if (!valorInput) return; // Si el usuario cancela

            let cantidad = parseFloat(valorInput);
            if (isNaN(cantidad) || cantidad <= 0) {
                alert("Ingresa un número válido mayor a 0.");
                return;
            }

            // Convertir a número negativo si es una resta
            if (esResta) {
                cantidad = -cantidad;
            }

            try {
                const res = await fetch(`${API_URL}/insumos/${id_insumo}/stock`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cantidad_agregar: cantidad })
                });

                if (res.ok) {
                    alert(`Stock de "${nombre}" actualizado correctamente.`);
                    cargarInsumos();
                } else {
                    const err = await res.json();
                    alert(`Error: ${err.error}`);
                }
            } catch (error) {
                alert("Error de conexión al actualizar el stock.");
            }
        }

        // Crear nuevo insumo
        document.getElementById('form-insumo').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre-insumo').value;
            const cantidad_actual = parseFloat(document.getElementById('cantidad-insumo').value);

            try {
                const res = await fetch(`${API_URL}/insumos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre, cantidad_actual })
                });

                if (res.ok) {
                    alert("Insumo guardado correctamente.");
                    document.getElementById('form-insumo').reset();
                    cargarInsumos();
                } else {
                    alert("Error al registrar el insumo.");
                }
            } catch (error) {
                alert("Error de conexión.");
            }
        });

        // Carga inicial
        cargarInsumos();
    </script>
</body>
</html>
