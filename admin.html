<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Administración - Productos y Recetas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .seccion { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 6px; }
        input, select { margin: 5px 0; padding: 8px; width: 98%; }
        button { background: #007bff; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    </style>
</head>
<body>
    <h2>🛠️ Administración de Productos y Recetas</h2>

    <div class="seccion">
        <h3>Agregar Producto</h3>
        <input type="text" id="prod-nombre" placeholder="Nombre del producto">
        <input type="text" id="prod-desc" placeholder="Descripción">
        <input type="number" step="0.01" id="prod-precio" placeholder="Precio ($)">
        <input type="number" id="prod-cat" placeholder="ID Categoría (Ej. 1)">
        <button onclick="guardarProducto()">Guardar Producto</button>
    </div>

    <div class="seccion">
        <h3>Configurar Receta (Descuento automático)</h3>
        <label>Producto:</label>
        <select id="select-producto"></select>
        <label>Insumo Requerido:</label>
        <select id="select-insumo"></select>
        <input type="number" step="0.01" id="receta-cant" placeholder="Cantidad que se descuenta por pedido">
        <button onclick="guardarReceta()" style="background:#28a745;">Asociar Receta</button>
    </div>

    <div class="seccion">
        <h3>Catálogo</h3>
        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Acción</th></tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
        </table>
    </div>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function CargarDatos() {
            const [resP, resI] = await Promise.all([
                fetch(`${API_URL}/productos`),
                fetch(`${API_URL}/insumos`)
            ]);
            const productos = await resP.json();
            const insumos = await resI.json();

            const tbody = document.getElementById('tabla-productos');
            tbody.innerHTML = '';
            productos.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.id_producto}</td><td>${p.nombre}</td><td>$${p.precio}</td><td><button onclick="eliminarProducto(${p.id_producto})" style="background:red;">Eliminar</button></td></tr>`;
            });

            document.getElementById('select-producto').innerHTML = productos.map(p => `<option value="${p.id_producto}">${p.nombre}</option>`).join('');
            document.getElementById('select-insumo').innerHTML = insumos.map(i => `<option value="${i.id_insumo}">${i.nombre}</option>`).join('');
        }

        async function guardarProducto() {
            const body = {
                nombre: document.getElementById('prod-nombre').value,
                descripcion: document.getElementById('prod-desc').value,
                precio: document.getElementById('prod-precio').value,
                id_categoria: document.getElementById('prod-cat').value || 1
            };
            await fetch(`${API_URL}/productos`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            CargarDatos();
        }

        async function guardarReceta() {
            const body = {
                id_producto: document.getElementById('select-producto').value,
                id_insumo: document.getElementById('select-insumo').value,
                cantidad_requerida: document.getElementById('receta-cant').value
            };
            await fetch(`${API_URL}/recetas`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
            alert('Receta asociada exitosamente');
        }

        async function eliminarProducto(id) {
            if (confirm('¿Eliminar producto?')) {
                await fetch(`${API_URL}/productos/${id}`, { method: 'DELETE' });
                CargarDatos();
            }
        }

        CargarDatos();
    </script>
</body>
</html>
