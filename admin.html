<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración e Inventario - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 20px; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .tab-btn { padding: 10px 20px; background: #ecf0f1; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; color: #2c3e50; }
        .tab-btn.active { background: #3498db; color: white; }
        .section { display: none; }
        .section.active { display: block; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        input, select, button { padding: 8px; margin: 5px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-add { background-color: #27ae60; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-edit { background-color: #f39c12; color: white; border: none; cursor: pointer; }
        .btn-delete { background-color: #e74c3c; color: white; border: none; cursor: pointer; }
        .form-group { display: flex; gap: 10px; align-items: center; background: #ecf0f1; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Panel de Administración</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="mostrarSeccion('insumos')">Inventario (Insumos)</button>
        <button class="tab-btn" onclick="mostrarSeccion('productos')">Menú (Productos)</button>
        <button class="tab-btn" onclick="mostrarSeccion('recetas')">Recetas</button>
    </div>

    <!-- SECCIÓN INSUMOS -->
    <div id="insumos" class="section active">
        <h2>Gestión de Inventario</h2>
        <div class="form-group">
            <input type="text" id="nuevo-insumo-nombre" placeholder="Nombre del Insumo (Ej. Pan)">
            <input type="number" id="nuevo-insumo-cant" placeholder="Cantidad Inicial" value="0">
            <button class="btn-add" onclick="agregarInsumo()">➕ Agregar Insumo</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nombre</th>
                    <th>Stock Actual</th>
                    <th>Stock Mínimo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tabla-insumos"></tbody>
        </table>
    </div>

    <!-- SECCIÓN PRODUCTOS -->
    <div id="productos" class="section">
        <h2>Productos del Menú</h2>
        <div class="form-group">
            <input type="text" id="nuevo-prod-nombre" placeholder="Nombre (Ej. Hamburguesa)">
            <input type="number" id="nuevo-prod-precio" placeholder="Precio ($)">
            <button class="btn-add" onclick="agregarProducto()">➕ Agregar Producto</button>
        </div>
        <table>
            <thead>
                <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tabla-productos"></tbody>
        </table>
    </div>

    <!-- SECCIÓN RECETAS -->
    <div id="recetas" class="section">
        <h2>Recetas (Descuento automático)</h2>
        <div class="form-group">
            <select id="select-producto"><option value="">Selecciona Producto...</option></select>
            <select id="select-insumo"><option value="">Selecciona Insumo...</option></select>
            <input type="number" id="receta-cant" placeholder="Cant. a descontar" step="0.01">
            <button class="btn-add" onclick="agregarReceta()">➕ Vincular</button>
        </div>
        <table>
            <thead>
                <tr><th>Producto</th><th>Insumo Descontado</th><th>Cantidad</th><th>Acciones</th></tr>
            </thead>
            <tbody id="tabla-recetas"></tbody>
        </table>
    </div>
</div>

<!-- BOTÓN PARA DESBLOQUEAR SONIDO -->
<button onclick="activarSonido()" style="position: fixed; bottom: 20px; left: 20px; background: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 9999;">
    🔊 Activar Sonido de Alertas
</button>

<!-- ALERTA DE INVENTARIO Y SONIDO -->
<div id="alerta-inventario" style="display: none; position: fixed; bottom: 20px; right: 20px; background: #e74c3c; color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); z-index: 9999; max-width: 300px; border-left: 5px solid #c0392b;">
    <h3 style="margin: 0 0 10px 0;">⚠️ Alerta de Stock</h3>
    <ul id="lista-alertas" style="margin: 0; padding-left: 20px; font-size: 0.95rem; line-height: 1.4;"></ul>
    <button onclick="document.getElementById('alerta-inventario').style.display='none'" style="margin-top: 15px; width: 100%; background: white; color: #e74c3c; border: none; padding: 8px; cursor: pointer; border-radius: 4px; font-weight: bold;">Entendido</button>
</div>

<script>
    const API = 'https://backend-la-escondida.onrender.com/api';

    // Cambiar pestañas
    function mostrarSeccion(id) {
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    // ==========================================
    // INSUMOS E INVENTARIO
    // ==========================================
    async function cargarInsumos() {
        const res = await fetch(`${API}/insumos`);
        const data = await res.json();
        const tbody = document.getElementById('tabla-insumos');
        const select = document.getElementById('select-insumo');
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">Selecciona Insumo...</option>';

        data.forEach(i => {
            select.innerHTML += `<option value="${i.id_insumo}">${i.nombre}</option>`;
            tbody.innerHTML += `
                <tr>
                    <td>${i.id_insumo}</td>
                    <td><strong>${i.nombre}</strong></td>
                    <td style="${i.cantidad_actual <= i.stock_minimo ? 'color: red; font-weight: bold;' : ''}">${i.cantidad_actual}</td>
                    <td>${i.stock_minimo || 5}</td>
                    <td>
                        <button class="btn-add" onclick="sumarStock(${i.id_insumo})">➕ Ingresar Stock</button>
                        <button class="btn-edit" onclick="editarMinimo(${i.id_insumo}, '${i.nombre}')">⚙️ Límite Min.</button>
                    </td>
                </tr>
            `;
        });
    }

    async function agregarInsumo() {
        const nombre = document.getElementById('nuevo-insumo-nombre').value;
        const cant = document.getElementById('nuevo-insumo-cant').value;
        if(!nombre) return alert('Pon un nombre');
        
        await fetch(`${API}/insumos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, cantidad_actual: cant })
        });
        document.getElementById('nuevo-insumo-nombre').value = '';
        cargarInsumos();
    }

    async function sumarStock(id) {
        const agregar = prompt('¿Cuántas unidades/gramos vas a AGREGAR al inventario actual?');
        if (!agregar || isNaN(agregar)) return;
        
        await fetch(`${API}/insumos/${id}/stock`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ cantidad_agregar: parseFloat(agregar) })
        });
        cargarInsumos();
    }

    async function editarMinimo(id, nombre) {
        const nuevoMinimo = prompt(`¿A partir de qué cantidad quieres que el sistema te alerte que se está acabando: ${nombre}?`);
        if (!nuevoMinimo || isNaN(nuevoMinimo)) return;

        await fetch(`${API}/insumos/${id}/minimo`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ stock_minimo: parseFloat(nuevoMinimo) })
        });
        cargarInsumos();
    }

    // ==========================================
    // PRODUCTOS Y RECETAS
    // ==========================================
    async function cargarProductos() {
        const res = await fetch(`${API}/productos`);
        const data = await res.json();
        const tbody = document.getElementById('tabla-productos');
        const select = document.getElementById('select-producto');
        tbody.innerHTML = '';
        select.innerHTML = '<option value="">Selecciona Producto...</option>';

        data.forEach(p => {
            select.innerHTML += `<option value="${p.id_producto}">${p.nombre}</option>`;
            tbody.innerHTML += `
                <tr>
                    <td>${p.id_producto}</td>
                    <td>${p.nombre}</td>
                    <td>$${p.precio}</td>
                    <td><button class="btn-delete" onclick="borrarProducto(${p.id_producto})">🗑️ Borrar</button></td>
                </tr>
            `;
        });
    }

    async function agregarProducto() {
        const nombre = document.getElementById('nuevo-prod-nombre').value;
        const precio = document.getElementById('nuevo-prod-precio').value;
        if(!nombre || !precio) return alert('Completa los campos');
        
        await fetch(`${API}/productos`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nombre, precio })
        });
        document.getElementById('nuevo-prod-nombre').value = '';
        document.getElementById('nuevo-prod-precio').value = '';
        cargarProductos();
    }

    async function borrarProducto(id) {
        if(!confirm('¿Seguro que quieres borrar este producto?')) return;
        await fetch(`${API}/productos/${id}`, { method: 'DELETE' });
        cargarProductos();
    }

    async function cargarRecetas() {
        const res = await fetch(`${API}/recetas`);
        const data = await res.json();
        const tbody = document.getElementById('tabla-recetas');
        tbody.innerHTML = '';

        data.forEach(r => {
            tbody.innerHTML += `
                <tr>
                    <td><strong>${r.nombre_producto}</strong></td>
                    <td>${r.nombre_insumo}</td>
                    <td>Descuenta: ${r.cantidad_requerida}</td>
                    <td><button class="btn-delete" onclick="borrarReceta(${r.id_producto}, ${r.id_insumo})">🗑️ Desvincular</button></td>
                </tr>
            `;
        });
    }

    async function agregarReceta() {
        const id_producto = document.getElementById('select-producto').value;
        const id_insumo = document.getElementById('select-insumo').value;
        const cantidad_requerida = document.getElementById('receta-cant').value;
        
        if(!id_producto || !id_insumo || !cantidad_requerida) return alert('Completa la receta');

        await fetch(`${API}/recetas`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id_producto, id_insumo, cantidad_requerida })
        });
        cargarRecetas();
    }

    async function borrarReceta(id_prod, id_insumo) {
        if(!confirm('¿Quitar este ingrediente de la receta?')) return;
        await fetch(`${API}/recetas/${id_prod}/${id_insumo}`, { method: 'DELETE' });
        cargarRecetas();
    }

    // ==========================================
    // SISTEMA DE ALERTAS CON SONIDO
    // ==========================================
    const tonoAlerta = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
    let alertaSonando = false;

    // Función vital para que el navegador dé permiso de reproducir audio
    function activarSonido() {
        tonoAlerta.play().then(() => {
            alert("✅ ¡Sonido activado! Las alertas sonarán automáticamente.");
        }).catch(e => {
            alert("❌ Error al reproducir. Revisa el volumen de tu equipo.");
        });
    }

    async function checarInventarioAlertas() {
        try {
            const res = await fetch(`${API}/alertas/inventario`);
            const insumosEnPeligro = await res.json();

            if (insumosEnPeligro.length > 0) {
                const listaUl = document.getElementById('lista-alertas');
                listaUl.innerHTML = ''; 
                
                insumosEnPeligro.forEach(insumo => {
                    const li = document.createElement('li');
                    li.style.marginBottom = '5px';
                    if (insumo.cantidad_actual <= 0) {
                        li.innerHTML = `<strong>¡AGOTADO!</strong> ${insumo.nombre}`;
                    } else {
                        li.innerHTML = `<strong>Bajo:</strong> ${insumo.nombre} (Quedan: ${parseFloat(insumo.cantidad_actual).toFixed(2)})`;
                    }
                    listaUl.appendChild(li);
                });

                document.getElementById('alerta-inventario').style.display = 'block';

                if (!alertaSonando) {
                    tonoAlerta.play().catch(e => console.log("El navegador bloqueó el sonido. Presiona el botón de Activar Sonido."));
                    alertaSonando = true;
                }
            } else {
                document.getElementById('alerta-inventario').style.display = 'none';
                alertaSonando = false; 
            }
        } catch (error) { console.error("Error revisando alertas:", error); }
    }

    // Inicializar todo
    cargarInsumos();
    cargarProductos();
    cargarRecetas();
    setInterval(checarInventarioAlertas, 15000); // Revisa cada 15 seg
    setTimeout(checarInventarioAlertas, 2000);   // Revisa al cargar la página

</script>
</body>
</html>
