<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Administración</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        nav a { padding: 8px 12px; background: #2c3e50; color: white; text-decoration: none; border-radius: 4px; }
        .grid-admin { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 1100px; margin: 0 auto; }
        @media(max-width: 768px) { .grid-admin { grid-template-columns: 1fr; } }
        .box { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #8e44ad; color: white; font-weight: bold; border: none; margin-top: 10px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 8px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #eee; }
        .btn-del { background: #c0392b; color: white; border: none; padding: 4px 8px; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>
    <header>
        <h1>Administración de Menú y Recetas</h1>
        <nav>
            <a href="index.html">Tomar Orden</a>
            <a href="cocina.html">Cocina</a>
            <a href="caja.html">Caja</a>
            <a href="inventario.html">Inventario</a>
            <a href="reportes.html">Reportes</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <div class="grid-admin">
        <div class="box">
            <h2>Productos del Menú</h2>
            <div class="form-group">
                <label>Nombre del Producto:</label>
                <input type="text" id="prod-nombre">
            </div>
            <div class="form-group">
                <label>Precio:</label>
                <input type="number" id="prod-precio" step="0.01">
            </div>
            <button onclick="guardarProducto()">Guardar Producto</button>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-productos"></tbody>
            </table>
        </div>

        <div class="box">
            <h2>Configuración de Recetas</h2>
            <div class="form-group">
                <label>Seleccionar Producto:</label>
                <select id="receta-producto"></select>
            </div>
            <div class="form-group">
                <label>Seleccionar Insumo:</label>
                <select id="receta-insumo"></select>
            </div>
            <div class="form-group">
                <label>Cantidad Requerida:</label>
                <input type="number" id="receta-cantidad" step="0.001">
            </div>
            <button onclick="guardarReceta()">Asociar Insumo a Producto</button>

            <table>
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th>Insumo</th>
                        <th>Cant.</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tabla-recetas"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function cargarTodo() {
            await cargarProductos();
            await cargarInsumosOptions();
            await cargarRecetas();
        }

        async function cargarProductos() {
            const res = await fetch(`${API_URL}/productos`);
            const productos = await res.json();
            const tbody = document.getElementById('tabla-productos');
            const select = document.getElementById('receta-producto');
            
            tbody.innerHTML = '';
            select.innerHTML = '';

            productos.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${p.nombre}</td>
                    <td>$${parseFloat(p.precio).toFixed(2)}</td>
                    <td><button class="btn-del" onclick="eliminarProducto(${p.id_producto})">Baja</button></td>
                `;
                tbody.appendChild(tr);

                const opt = document.createElement('option');
                opt.value = p.id_producto;
                opt.textContent = p.nombre;
                select.appendChild(opt);
            });
        }

        async function guardarProducto() {
            const nombre = document.getElementById('prod-nombre').value;
            const precio = parseFloat(document.getElementById('prod-precio').value);

            if (!nombre || isNaN(precio)) return alert('Ingresa datos válidos');

            await fetch(`${API_URL}/productos`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nombre, precio })
            });

            document.getElementById('prod-nombre').value = '';
            document.getElementById('prod-precio').value = '';
            cargarProductos();
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Dar de baja este producto?')) return;
            await fetch(`${API_URL}/productos/${id}`, { method: 'DELETE' });
            cargarProductos();
        }

        async function cargarInsumosOptions() {
            const res = await fetch(`${API_URL}/insumos`);
            const insumos = await res.json();
            const select = document.getElementById('receta-insumo');
            select.innerHTML = '';

            insumos.forEach(i => {
                const opt = document.createElement('option');
                opt.value = i.id_insumo;
                opt.textContent = i.nombre;
                select.appendChild(opt);
            });
        }

        async function cargarRecetas() {
            const res = await fetch(`${API_URL}/recetas`);
            const recetas = await res.json();
            const tbody = document.getElementById('tabla-recetas');
            tbody.innerHTML = '';

            recetas.forEach(r => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${r.nombre_producto}</td>
                    <td>${r.nombre_insumo}</td>
                    <td>${r.cantidad_requerida}</td>
                    <td><button class="btn-del" onclick="eliminarReceta(${r.id_producto}, ${r.id_insumo})">X</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function guardarReceta() {
            const id_producto = document.getElementById('receta-producto').value;
            const id_insumo = document.getElementById('receta-insumo').value;
            const cantidad_requerida = parseFloat(document.getElementById('receta-cantidad').value);

            if (!id_producto || !id_insumo || isNaN(cantidad_requerida)) return alert('Campos incompletos');

            await fetch(`${API_URL}/recetas`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_producto, id_insumo, cantidad_requerida })
            });

            cargarRecetas();
        }

        async function eliminarReceta(id_producto, id_insumo) {
            await fetch(`${API_URL}/recetas/${id_producto}/${id_insumo}`, { method: 'DELETE' });
            cargarRecetas();
        }

        window.onload = cargarTodo;
    </script>
</body>
</html>
