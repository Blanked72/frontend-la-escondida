<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Reportes</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        nav { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        nav a { padding: 8px 12px; background: #2c3e50; color: white; text-decoration: none; border-radius: 4px; }
        .kpi-container { display: flex; gap: 20px; justify-content: center; margin-bottom: 30px; flex-wrap: wrap; }
        .kpi-card { background: white; padding: 20px; border-radius: 8px; width: 220px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-top: 4px solid #27ae60; }
        .kpi-card h3 { margin: 0; color: #7f8c8d; font-size: 0.9em; }
        .kpi-card .value { font-size: 1.8em; font-weight: bold; margin: 10px 0; color: #2c3e50; }
        table { width: 100%; max-width: 800px; margin: 0 auto; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #2c3e50; color: white; }
    </style>
</head>
<body>
    <header>
        <h1>Reportes de Ventas</h1>
        <nav>
            <a href="index.html">Tomar Orden</a>
            <a href="cocina.html">Cocina</a>
            <a href="caja.html">Caja</a>
            <a href="inventario.html">Inventario</a>
            <a href="reportes.html">Reportes</a>
            <a href="admin.html">Admin</a>
        </nav>
    </header>

    <div class="kpi-container">
        <div class="kpi-card">
            <h3>VENTAS HOY</h3>
            <div id="hoy-total" class="value">$0.00</div>
            <span id="hoy-ordenes">0 órdenes</span>
        </div>
        <div class="kpi-card" style="border-top-color: #2980b9;">
            <h3>VENTAS ACUMULADAS</h3>
            <div id="general-total" class="value">$0.00</div>
            <span id="general-ordenes">0 órdenes</span>
        </div>
    </div>

    <h2 style="text-align: center;">Historial Diario</h2>
    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Órdenes Cobradas</th>
                <th>Total Vendido</th>
            </tr>
        </thead>
        <tbody id="tabla-historial">
            <tr><td colspan="3" style="text-align:center">Cargando historial...</td></tr>
        </tbody>
    </table>

    <script>
        const API_URL = 'http://localhost:3000/api';

        async function cargarReportes() {
            try {
                const resHoy = await fetch(`${API_URL}/reportes/ventas/hoy`);
                const hoy = await resHoy.json();
                document.getElementById('hoy-total').textContent = `$${parseFloat(hoy.total_vendido).toFixed(2)}`;
                document.getElementById('hoy-ordenes').textContent = `${hoy.total_ordenes} órdenes`;

                const resGen = await fetch(`${API_URL}/reportes/ventas`);
                const gen = await resGen.json();
                document.getElementById('general-total').textContent = `$${parseFloat(gen.total_vendido).toFixed(2)}`;
                document.getElementById('general-ordenes').textContent = `${gen.total_ordenes} órdenes`;

                const resHist = await fetch(`${API_URL}/reportes/ventas/historial`);
                const historial = await resHist.json();
                const tbody = document.getElementById('tabla-historial');
                tbody.innerHTML = '';

                historial.forEach(h => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><strong>${h.fecha}</strong></td>
                        <td>${h.total_ordenes}</td>
                        <td>$${parseFloat(h.total_vendido).toFixed(2)}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error('Error cargando reportes:', err);
            }
        }

        window.onload = cargarReportes;
    </script>
</body>
</html>
