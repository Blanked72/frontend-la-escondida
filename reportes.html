<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 2rem; }
        h1 { text-align: center; color: #2c3e50; }
        .dashboard { display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap; margin-top: 2rem; }
        .tarjeta-metrica { background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; min-width: 250px; border-top: 5px solid #27ae60; }
        .tarjeta-metrica.ordenes { border-top-color: #8e44ad; }
        .tarjeta-metrica h3 { margin: 0 0 10px 0; color: #7f8c8d; font-size: 1.2rem; }
        .numero { font-size: 3rem; font-weight: bold; color: #2c3e50; margin: 0; }
        .btn-actualizar { display: block; margin: 3rem auto 0; background-color: #34495e; color: white; border: none; padding: 10px 20px; font-size: 1.1rem; border-radius: 5px; cursor: pointer; }
        .btn-actualizar:hover { background-color: #2c3e50; }
    </style>
</head>
<body>

    <h1>📊 Resumen de Ventas del Día</h1>
    
    <div class="dashboard">
        <div class="tarjeta-metrica">
            <h3>Ingresos Totales Hoy</h3>
            <p class="numero">$<span id="total-vendido">0.00</span></p>
        </div>
        
        <div class="tarjeta-metrica ordenes">
            <h3>Órdenes Cobradas</h3>
            <p class="numero" id="total-ordenes">0</p>
        </div>
    </div>

    <button class="btn-actualizar" onclick="cargarReporte()">🔄 Actualizar Datos</button>

    <script>
        async function cargarReporte() {
            try {
                const respuesta = await fetch('https://backend-la-escondida.onrender.com/api/reportes/ventas');
                const datos = await respuesta.json();
                
                // Actualizamos los números en la pantalla
                document.getElementById('total-vendido').innerText = parseFloat(datos.total_vendido).toFixed(2);
                document.getElementById('total-ordenes').innerText = datos.total_ordenes;
                
            } catch (error) {
                console.error("Error al cargar el reporte:", error);
                alert("No se pudo conectar con el servidor para obtener el reporte.");
            }
        }

        // Cargar los datos automáticamente al abrir la página
        cargarReporte();
    </script>
</body>
</html>
