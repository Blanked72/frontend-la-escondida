<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Reporte de Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <h2 class="mb-4">📊 Reporte de Ventas e Ingresos</h2>

        <!-- Resumen de Ventas de Hoy -->
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card bg-success text-white shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title">Ventas de Hoy</h5>
                        <h2 class="display-5 fw-bold mb-0">$<span id="ventas-hoy">0.00</span></h2>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card bg-info text-white shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title">Órdenes Pagadas Hoy</h5>
                        <h2 class="display-5 fw-bold mb-0"><span id="ordenes-hoy">0</span></h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabla Histórica de Ventas -->
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Historial Diario de Ventas</h5>
                <button class="btn btn-sm btn-outline-light" onclick="cargarReportes()">Actualizar</button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle">
                        <thead>
                            <tr>
                                <th>Fecha</th>
                                <th>Total de Órdenes</th>
                                <th>Monto Total Vendido</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-historial">
                            <tr>
                                <td colspan="3" class="text-center text-muted">Cargando reporte...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend-la-escondida.onrender.com/api';

        async function cargarReportes() {
            try {
                // Cargar métricas de hoy
                const resHoy = await fetch(`${API_URL}/reportes/ventas/hoy`);
                const dataHoy = await resHoy.json();

                document.getElementById('ventas-hoy').innerText = parseFloat(dataHoy.total_vendido || 0).toFixed(2);
                document.getElementById('ordenes-hoy').innerText = dataHoy.total_ordenes || 0;

                // Cargar historial por días
                const resHistorial = await fetch(`${API_URL}/reportes/ventas/historial`);
                const historial = await resHistorial.json();

                const tbody = document.getElementById('tabla-historial');
                tbody.innerHTML = '';

                if (historial.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">No hay ventas cobradas registradas.</td></tr>';
                    return;
                }

                historial.forEach(row => {
                    const fechaFormateada = new Date(row.fecha).toLocaleDateString('es-MX', { timeZone: 'UTC' });
                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">${fechaFormateada}</td>
                            <td><span class="badge bg-secondary">${row.total_ordenes} órdenes</span></td>
                            <td class="fw-bold text-success">$${parseFloat(row.total_vendido).toFixed(2)}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error cargando los reportes:', error);
            }
        }

        cargarReportes();
    </script>
</body>
</html>
