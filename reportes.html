<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes de Ventas</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .resumen { display: flex; gap: 20px; margin-bottom: 20px; }
        .box { padding: 20px; border-radius: 8px; background: #e3f2fd; flex: 1; text-align: center; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #0d47a1; color: white; }
    </style>
</head>
<body>
    <h2>📊 Ventas Diarias</h2>

    <div class="resumen">
        <div class="box">
            <h3>Órdenes Cobradas</h3>
            <h1 id="total-ordenes">0</h1>
        </div>
        <div class="box" style="background:#e8f5e9;">
            <h3>Total Generado</h3>
            <h1 id="total-dinero">$0.00</h1>
        </div>
    </div>

    <h3>Historial de Ventas</h3>
    <table>
        <thead>
            <tr>
                <th>N° Orden</th>
                <th>Mesa</th>
                <th>Total</th>
                <th>Fecha/Hora</th>
            </tr>
        </thead>
        <tbody id="tabla-reporte"></tbody>
    </table>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function cargarReporte() {
            const res = await fetch(`${API_URL}/reportes/ventas`);
            const data = await res.json();

            document.getElementById('total-ordenes').innerText = data.resumen.ordenes_totales;
            document.getElementById('total-dinero').innerText = `$${parseFloat(data.resumen.total_ventas).toFixed(2)}`;

            const tbody = document.getElementById('tabla-reporte');
            tbody.innerHTML = '';
            data.historial.forEach(h => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${h.id_orden}</td>
                        <td>Mesa ${h.numero_mesa}</td>
                        <td>$${parseFloat(h.total).toFixed(2)}</td>
                        <td>${new Date(h.fecha_creacion).toLocaleString()}</td>
                    </tr>
                `;
            });
        }

        cargarReporte();
    </script>
</body>
</html>
