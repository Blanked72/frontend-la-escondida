<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Meseros - La Escondida</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #2c3e50; color: white; }
        header { background-color: #1a252f; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        header h1 { margin: 0; font-size: 1.8rem; color: #f1c40f; }
        
        .container { padding: 20px; max-width: 1000px; margin: 0 auto; }
        
        .controles { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-refresh { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .btn-refresh:hover { background-color: #2980b9; }

        /* Cuadrícula de Tickets */
        .grid-ordenes { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        
        .ticket { background: #ecf0f1; color: #333; border-radius: 8px; padding: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.2); position: relative; border-top: 5px solid #e74c3c; }

        .ticket-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #bdc3c7; padding-bottom: 10px; margin-bottom: 10px; }
        .ticket-header h2 { margin: 0; font-size: 1.4rem; color: #2c3e50; }
        .badge-estado { padding: 5px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; color: white; background: #e74c3c; }

        .btn-ver { background-color: #2c3e50; color: white; border: none; padding: 8px; width: 100%; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        
        /* Modal para ver detalles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
        .modal-content { background: white; color: #333; width: 100%; max-width: 500px; border-radius: 8px; padding: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px; }
        .btn-close { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ecf0f1; text-align: left; }
        th { background-color: #f4f6f8; }
    </style>
</head>
<body>

    <header>
        <h1>👨‍🍳 Panel de Control - La Escondida</h1>
    </header>

    <div class="container">
        <div class="controles">
            <h3>Órdenes Pendientes</h3>
            <button class="btn-refresh" onclick="cargarOrdenes()">🔄 Actualizar Órdenes</button>
        </div>

        <div id="grid-ordenes" class="grid-ordenes">
            <p>Cargando órdenes...</p>
        </div>
    </div>

    <!-- MODAL DE DETALLES -->
    <div id="modal-detalles" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-titulo">Detalles de Orden</h2>
                <button class="btn-close" onclick="cerrarModal()">✖</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const API = 'https://backend-la-escondida.onrender.com/api';

        // Cargar las órdenes al abrir la página
        cargarOrdenes();

        // Actualizar automáticamente cada 15 segundos
        setInterval(cargarOrdenes, 15000);

        async function cargarOrdenes() {
            try {
                const res = await fetch(`${API}/ordenes`);
                const ordenes = await res.json();
                
                const grid = document.getElementById('grid-ordenes');
                grid.innerHTML = '';

                // FILTRO: Solo nos quedamos con las que dicen "Pendiente"
                const ordenesPendientes = ordenes.filter(o => o.estado === 'Pendiente');

                if (ordenesPendientes.length === 0) {
                    grid.innerHTML = '<p style="font-size: 1.2rem;">No hay órdenes pendientes. ¡Todo bajo control! 😎</p>';
                    return;
                }

                // Invertimos el arreglo para ver las más nuevas primero
                ordenesPendientes.reverse().forEach(o => {
                    grid.innerHTML += `
                        <div class="ticket">
                            <div class="ticket-header">
                                <h2>Mesa ${o.numero_mesa}</h2>
                                <span class="badge-estado">${o.estado}</span>
                            </div>
                            <p><strong>Orden:</strong> #${o.id_orden}</p>
                            <p><strong>Total:</strong> $${o.total}</p>
                            <button class="btn-ver" onclick="verDetalles(${o.id_orden}, ${o.numero_mesa})">📋 Ver Detalles del Pedido</button>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error cargando órdenes:", error);
                document.getElementById('grid-ordenes').innerHTML = '<p style="color:#e74c3c;">Error al conectar con el servidor.</p>';
            }
        }

        async function verDetalles(id_orden, mesa) {
            document.getElementById('modal-titulo').innerText = `Orden #${id_orden} - Mesa ${mesa}`;
            const body = document.getElementById('modal-body');
            body.innerHTML = '<p>Cargando platillos...</p>';
            
            try {
                const res = await fetch(`${API}/ordenes/${id_orden}/detalles`);
                const detalles = await res.json();
                
                let html = '<table>';
                html += '<tr><th>Cant.</th><th>Platillo</th></tr>';
                
                detalles.forEach(d => {
                    const nombreProd = d.notas ? d.notas : (d.nombre || 'Desconocido');
                    html += `<tr>
                        <td><strong>${d.cantidad}x</strong></td>
                        <td>${nombreProd}</td>
                    </tr>`;
                });
                
                html += '</table>';
                body.innerHTML = html;
                document.getElementById('modal-detalles').style.display = 'flex';
            } catch(error) {
                body.innerHTML = '<p style="color:red;">Error al cargar detalles.</p>';
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalles').style.display = 'none';
        }
    </script>
</body>
</html>
