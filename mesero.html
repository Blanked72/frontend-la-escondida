<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Escondida - Control de Meseros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>📋 Monitoreo de Mesas y Órdenes</h2>
            <button class="btn btn-outline-primary" onclick="cargarOrdenes()">🔄 Refrescar</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th># Orden</th>
                                <th>Mesa / Cliente</th>
                                <th>Detalles del Pedido</th>
                                <th>Total</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-ordenes-activas">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Cargando órdenes del día...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://backend-la-escondida.onrender.com/api';

        async function cargarOrdenes() {
            try {
                const res = await fetch(`${API_URL}/ordenes`);
                const ordenes = await res.json();

                const tbody = document.getElementById('tabla-ordenes-activas');
                tbody.innerHTML = '';

                if (ordenes.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" class="text-center py-4 text-muted">No hay órdenes registradas hoy</td></tr>';
                    return;
                }

                ordenes.forEach(o => {
                    let itemsStr = '';
                    if (o.detalles && o.detalles.length > 0) {
                        itemsStr = o.detalles.map(d => `${d.cantidad}x ${d.producto || 'Producto'}`).join(', ');
                    } else {
                        itemsStr = 'Sin detalles';
                    }

                    let badgeColor = 'bg-secondary';
                    if (o.estado === 'Pendiente') badgeColor = 'bg-warning text-dark';
                    if (o.estado === 'Entregado') badgeColor = 'bg-info text-dark';
                    if (o.estado === 'Pagado') badgeColor = 'bg-success';

                    tbody.innerHTML += `
                        <tr>
                            <td class="fw-bold">#${o.id_orden}</td>
                            <td class="fs-5 fw-bold">${o.numero_mesa}</td>
                            <td><small class="text-muted">${itemsStr}</small></td>
                            <td class="fw-bold">$${parseFloat(o.total).toFixed(2)}</td>
                            <td><span class="badge ${badgeColor} px-3 py-2">${o.estado}</span></td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error('Error al cargar órdenes:', error);
            }
        }

        setInterval(cargarOrdenes, 5000);
        cargarOrdenes();
    </script>
</body>
</html>
