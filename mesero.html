<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Mesero - Comandas Activas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar { background-color: #2c3e50; }
        .card-orden { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge-estado { font-size: 0.9rem; padding: 6px 10px; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="bi-shop me-2"></i>Panel de Meseros - Estado de Comandas</span>
            <button class="btn btn-outline-light btn-sm" onclick="cargarOrdenes()"><i class="bi bi-arrow-clockwise me-1"></i>Actualizar</button>
        </div>
    </nav>

    <div class="container">
        <div id="contenedor-ordenes" class="row g-4">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Cargando...</span>
                </div>
                <p class="mt-2 text-muted">Cargando comandas...</p>
            </div>
        </div>
    </div>

    <script>
        async function cargarOrdenes() {
            try {
                const response = await fetch('/api/ordenes');
                const ordenes = await response.json();
                
                const contenedor = document.getElementById('contenedor-ordenes');
                contenedor.innerHTML = '';

                // Incluye tanto órdenes presenciales 'Pendiente' como en línea 'A Domicilio'
                const ordenesActivas = ordenes.filter(o => o.estado === 'Pendiente' || o.estado === 'A Domicilio');

                if (ordenesActivas.length === 0) {
                    contenedor.innerHTML = `
                        <div class="col-12 text-center py-5">
                            <i class="bi bi-check-circle text-success display-1"></i>
                            <h3 class="mt-3 text-muted">No hay comandas activas en cocina</h3>
                        </div>`;
                    return;
                }

                ordenesActivas.forEach(orden => {
                    let productosHTML = '';
                    if (orden.detalles && orden.detalles.length > 0) {
                        productosHTML = orden.detalles.map(d => `
                            <li class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="fw-bold">${d.cantidad}x</span> ${d.producto || d.notas || 'Producto'}
                                    ${d.notas && d.producto ? `<br><small class="text-muted">${d.notas}</small>` : ''}
                                </div>
                            </li>
                        `).join('');
                    } else {
                        productosHTML = '<li class="list-group-item text-muted">Sin detalles de productos</li>';
                    }

                    const esDomicilio = orden.estado === 'A Domicilio';
                    const bgHeader = esDomicilio ? 'bg-warning text-dark' : 'bg-primary text-white';

                    const card = `
                        <div class="col-md-4 col-lg-3">
                            <div class="card card-orden h-100">
                                <div class="card-header ${bgHeader} d-flex justify-content-between align-items-center">
                                    <span><i class="bi ${esDomicilio ? 'bi-house' : 'bi-house-door'} me-2"></i>Mesa: ${orden.numero_mesa}</span>
                                    <span class="badge bg-light text-dark">#${orden.id_orden}</span>
                                </div>
                                <div class="card-body">
                                    <div class="mb-2">
                                        <span class="badge ${esDomicilio ? 'bg-warning text-dark' : 'bg-info text-dark'} badge-estado">${orden.estado}</span>
                                        <small class="text-muted d-block mt-1">${new Date(orden.fecha).toLocaleTimeString()}</small>
                                    </div>
                                    <ul class="list-group list-group-flush">
                                        ${productosHTML}
                                    </ul>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });

            } catch (error) {
                console.error('Error al cargar órdenes:', error);
            }
        }

        setInterval(cargarOrdenes, 5000); // Auto-refresco cada 5 segundos
        cargarOrdenes();
    </script>
</body>
</html>
