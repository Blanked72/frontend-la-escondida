<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mesero - Listos para Servir</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .grid { display: flex; flex-wrap: wrap; gap: 15px; }
        .orden-card { border: 2px solid #4CAF50; padding: 15px; border-radius: 8px; width: 250px; background: #e8f5e9; }
        button { background: #4CAF50; color: white; border: none; padding: 8px; width: 100%; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <h2>🔔 Vista de Mesero</h2>
    <div id="contenedor-mesero" class="grid"></div>

    <script>
        const API_URL = 'https://tu-app-en-render.onrender.com/api';

        async function cargarMesero() {
            const res = await fetch(`${API_URL}/ordenes`);
            const ordenes = await res.json();
            
            const listos = ordenes.filter(o => o.estado === 'Listo');
            const contenedor = document.getElementById('contenedor-mesero');
            contenedor.innerHTML = '';

            listos.forEach(o => {
                let itemsHTML = '';
                o.detalles.forEach(d => {
                    itemsHTML += `<li>${d.cantidad}x ${d.producto}</li>`;
                });

                contenedor.innerHTML += `
                    <div class="orden-card">
                        <h3>🔔 Llevar a Mesa #${o.numero_mesa}!</h3>
                        <ul>${itemsHTML}</ul>
                        <button onclick="marcarEntregado(${o.id_orden})">🏃 Entregado en Mesa</button>
                    </div>
                `;
            });
        }

        async function marcarEntregado(id) {
            await fetch(`${API_URL}/ordenes/${id}/estado`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ estado: 'Entregado' })
            });
            cargarMesero();
        }

        setInterval(cargarMesero, 4000);
        cargarMesero();
    </script>
</body>
</html>
